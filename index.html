<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="ระบบบันทึก ประมวลผล และแสดงผลรายงานสรุปการเบิกจ่ายเวชภัณฑ์ยาประจำเดือน">
<title>ระบบเบิกจ่ายเวชภัณฑ์ยา</title>
<!-- ตั้งธีมก่อนแสดงผล เพื่อไม่ให้หน้าจอกะพริบ -->
<script>
  (function () {
    var t = null;
    try { t = JSON.parse(localStorage.getItem('medreq5_theme')); } catch (e) {}
    if (t !== 'light' && t !== 'dark') t = (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', t);
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- SheetJS: ใช้เฉพาะการนำเข้า/ส่งออก Excel (ระบบส่วนอื่นทำงานได้แม้โหลดไม่สำเร็จ) -->
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* =====================================================================
   1) DESIGN TOKENS — สี/เงา/ขนาด (ธีมสว่าง + ธีมมืด)
   สีแบรนด์ --brand-1 / --brand-2 ถูกเขียนทับจาก CONFIG.THEME ตอนเริ่มระบบ
   สีชุดข้อมูลกราฟ (--series-*) ผ่านการตรวจสอบ CVD/contrast แล้ว ไม่ควรแก้
   ===================================================================== */
:root {
  --brand-1: #e5468f;
  --brand-2: #6c5dd3;
  --bg: #f3f1f9;
  --bg-blob-1: rgba(229, 70, 143, .16);
  --bg-blob-2: rgba(108, 93, 211, .17);
  --surface: rgba(255, 255, 255, .74);
  --surface-solid: #ffffff;
  --surface-2: #f7f6fc;
  --surface-sunk: #eeecf6;
  --border: rgba(40, 30, 80, .08);
  --border-strong: rgba(40, 30, 80, .15);
  --text: #1c1a2b;
  --text-2: #55526a;
  --muted: #858199;
  --grid: #ecebf2;
  --axis: #d3d1df;
  --series-b: #6c5dd3;   /* บ = เบิก */
  --series-j: #e5468f;   /* จ = จ่าย */
  --good: #0ca30c; --good-text: #006300;
  --warn: #fab219; --serious: #ec835a;
  --critical: #d03b3b; --info: #2a78d6;
  --shadow-sm: 0 2px 8px -2px rgba(60, 40, 120, .10);
  --shadow: 0 14px 34px -16px rgba(70, 45, 140, .24), 0 2px 6px -2px rgba(70, 45, 140, .06);
  --neu-out: 5px 5px 12px rgba(150, 140, 190, .20), -5px -5px 12px rgba(255, 255, 255, .92);
  --neu-in: inset 2px 2px 5px rgba(150, 140, 190, .22), inset -2px -2px 5px rgba(255, 255, 255, .95);
  --radius-lg: 22px; --radius: 16px; --radius-sm: 11px;
  --font: 'Noto Sans Thai', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --sidebar-w: 252px;
  color-scheme: light;
}
:root[data-theme="dark"] {
  --bg: #13111f;
  --bg-blob-1: rgba(229, 70, 143, .13);
  --bg-blob-2: rgba(108, 93, 211, .20);
  --surface: rgba(36, 31, 58, .76);
  --surface-solid: #241f3a;
  --surface-2: #2a2444;
  --surface-sunk: #1b172e;
  --border: rgba(255, 255, 255, .07);
  --border-strong: rgba(255, 255, 255, .14);
  --text: #f2f0fa;
  --text-2: #c5c1da;
  --muted: #8f8aa8;
  --grid: #322c4d;
  --axis: #463f66;
  --series-b: #8f80ec;
  --series-j: #de4f8f;
  --good-text: #3fcf3f;
  --shadow-sm: 0 2px 8px -2px rgba(0, 0, 0, .4);
  --shadow: 0 16px 36px -18px rgba(0, 0, 0, .7);
  --neu-out: 4px 4px 10px rgba(0, 0, 0, .35), -3px -3px 8px rgba(255, 255, 255, .03);
  --neu-in: inset 2px 2px 6px rgba(0, 0, 0, .45), inset -2px -2px 5px rgba(255, 255, 255, .04);
  color-scheme: dark;
}

/* =====================================================================
   2) BASE
   ===================================================================== */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; font-family: var(--font); font-size: 15px; line-height: 1.55;
  color: var(--text); background: var(--bg); min-height: 100vh;
  -webkit-font-smoothing: antialiased; overflow-x: hidden;
}
.bg-deco { position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background:
    radial-gradient(42rem 30rem at 8% -6%, var(--bg-blob-1), transparent 70%),
    radial-gradient(38rem 32rem at 100% 0%, var(--bg-blob-2), transparent 70%),
    radial-gradient(40rem 30rem at 60% 110%, var(--bg-blob-1), transparent 70%);
}
h1, h2, h3, h4 { margin: 0; line-height: 1.3; font-weight: 700; }
p { margin: 0; }
a { color: var(--brand-2); }
button, input, select, textarea { font: inherit; color: inherit; }
[hidden] { display: none !important; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.num, .tnum { font-variant-numeric: tabular-nums; }
:focus-visible { outline: 2px solid var(--brand-2); outline-offset: 2px; border-radius: 8px; }
.ico { width: 20px; height: 20px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.ico-sm { width: 16px; height: 16px; }

/* =====================================================================
   3) LAYOUT — Sidebar + Main (แบบ Modern Dashboard)
   ===================================================================== */
.app { position: relative; z-index: 1; display: grid; grid-template-columns: var(--sidebar-w) minmax(0, 1fr); min-height: 100vh; }
.sidebar {
  position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; gap: 18px;
  padding: 22px 16px 18px; background: var(--surface); backdrop-filter: blur(20px) saturate(150%);
  -webkit-backdrop-filter: blur(20px) saturate(150%); border-right: 1px solid var(--border); overflow-y: auto;
}
.brand { display: flex; align-items: center; gap: 11px; padding: 0 6px 6px; }
.brand img { width: 44px; height: 44px; object-fit: contain; border-radius: 12px; background: #fff; padding: 3px; box-shadow: var(--shadow-sm); }
.brand-name { font-weight: 700; font-size: 16px; line-height: 1.25; }
.brand-name b { color: var(--brand-1); }
.brand-org { font-size: 12px; color: var(--muted); line-height: 1.3; }
.nav { display: flex; flex-direction: column; gap: 3px; }
.nav-label { font-size: 11.5px; letter-spacing: .02em; color: var(--muted); padding: 10px 12px 4px; }
.nav a {
  position: relative; display: flex; align-items: center; gap: 11px; padding: 10px 12px; border-radius: 12px;
  color: var(--text-2); text-decoration: none; font-weight: 500; transition: background .15s, color .15s;
}
.nav a:hover { background: var(--surface-2); color: var(--text); }
.nav a.active { color: var(--brand-1); background: color-mix(in srgb, var(--brand-1) 11%, transparent); font-weight: 600; }
.nav a.active::after { content: ''; position: absolute; right: -16px; top: 8px; bottom: 8px; width: 3px; border-radius: 3px; background: var(--brand-1); }
.nav .nav-badge { margin-left: auto; font-size: 11px; padding: 1px 8px; border-radius: 99px; background: var(--brand-1); color: #fff; font-weight: 600; }
.side-card {
  margin-top: auto; padding: 16px; border-radius: 18px; color: #fff;
  background: linear-gradient(140deg, var(--brand-2), color-mix(in srgb, var(--brand-2) 55%, var(--brand-1)));
  box-shadow: 0 14px 30px -14px color-mix(in srgb, var(--brand-2) 70%, transparent);
}
.side-card .sc-label { font-size: 12.5px; opacity: .9; }
.side-card .sc-value { font-size: 22px; font-weight: 700; margin: 2px 0 10px; }
.side-card .sc-boxes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.side-card .sc-box { background: rgba(255,255,255,.95); color: #2b2450; border-radius: 9px; padding: 6px 2px; text-align: center; }
.side-card .sc-box b { display: block; font-size: 15px; line-height: 1.2; }
.side-card .sc-box small { font-size: 10.5px; color: #6d6790; }
.theme-switch { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--text-2); cursor: pointer; padding: 4px 6px; user-select: none; }
.switch { display: inline-flex; align-items: center; gap: 10px; cursor: pointer; user-select: none; }
.switch input, .theme-switch input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.track { position: relative; width: 40px; height: 22px; border-radius: 99px; background: var(--surface-sunk); box-shadow: var(--neu-in); transition: background .2s; flex: none; }
.track::after { content: ''; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: transform .2s; }
input:checked + .track { background: var(--brand-2); }
input:checked + .track::after { transform: translateX(18px); }
input:focus-visible + .track { outline: 2px solid var(--brand-2); outline-offset: 2px; }

.main { min-width: 0; padding: 22px 28px 40px; }
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 20px; flex-wrap: wrap; }
.topbar h1 { font-size: 24px; }
.topbar p { color: var(--muted); font-size: 13.5px; margin-top: 2px; }
.topbar-right { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.conn-chip { display: inline-flex; align-items: center; gap: 7px; padding: 6px 12px; border-radius: 99px; font-size: 12.5px; font-weight: 600; background: var(--surface); border: 1px solid var(--border); backdrop-filter: blur(10px); }
.conn-chip .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--warn); }
.conn-chip.online .dot { background: var(--good); }
.conn-chip.error .dot { background: var(--critical); }
.updated { font-size: 12.5px; color: var(--muted); }

/* =====================================================================
   4) COMPONENTS — Card / Button / Badge / Field / Table
   ===================================================================== */
.card {
  background: var(--surface); backdrop-filter: blur(18px) saturate(140%); -webkit-backdrop-filter: blur(18px) saturate(140%);
  border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: var(--shadow); padding: 18px 20px; min-width: 0;
}
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
.card-head h3 { font-size: 15.5px; }
.card-head .sub { font-size: 12.5px; color: var(--muted); font-weight: 400; }
.card.clickable { cursor: pointer; transition: transform .15s, box-shadow .15s; }
.card.clickable:hover { transform: translateY(-2px); box-shadow: 0 18px 38px -16px rgba(70,45,140,.32); }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 10px 16px; min-height: 42px;
  border-radius: 12px; border: 1px solid transparent; font-weight: 600; font-size: 14px; cursor: pointer;
  background: var(--surface-solid); color: var(--text); text-decoration: none; white-space: nowrap;
  transition: transform .12s, box-shadow .15s, background .15s, opacity .15s;
}
.btn:active { transform: translateY(1px); }
.btn:disabled, .btn[aria-disabled="true"] { opacity: .5; cursor: not-allowed; transform: none; }
.btn-primary { color: #fff; background: linear-gradient(135deg, var(--brand-1), color-mix(in srgb, var(--brand-1) 45%, var(--brand-2))); box-shadow: 0 10px 22px -10px color-mix(in srgb, var(--brand-1) 80%, transparent); }
.btn-secondary { color: #fff; background: var(--brand-2); box-shadow: 0 10px 22px -12px color-mix(in srgb, var(--brand-2) 80%, transparent); }
.btn-soft { background: var(--surface-2); border-color: var(--border); box-shadow: var(--neu-out); }
.btn-ghost { background: transparent; border-color: var(--border-strong); }
.btn-danger { color: #fff; background: var(--critical); }
.btn-sm { min-height: 34px; padding: 6px 12px; font-size: 13px; border-radius: 10px; }
.btn-icon { min-height: 36px; width: 36px; padding: 0; border-radius: 10px; }
.btn-group { display: flex; gap: 8px; flex-wrap: wrap; }

.badge { display: inline-flex; align-items: center; gap: 5px; padding: 2px 10px; border-radius: 99px; font-size: 12px; font-weight: 600; white-space: nowrap; border: 1px solid transparent; }
.badge .ico { width: 13px; height: 13px; }
.badge.good { color: var(--good-text); background: color-mix(in srgb, var(--good) 13%, transparent); }
.badge.warn { color: #8a5a00; background: color-mix(in srgb, var(--warn) 22%, transparent); }
:root[data-theme="dark"] .badge.warn { color: var(--warn); }
.badge.info { color: var(--brand-2); background: color-mix(in srgb, var(--brand-2) 14%, transparent); }
:root[data-theme="dark"] .badge.info { color: var(--series-b); }
.badge.crit { color: var(--critical); background: color-mix(in srgb, var(--critical) 12%, transparent); }
.badge.muted { color: var(--text-2); background: var(--surface-sunk); }
.pill-b, .pill-j { display: inline-block; width: 10px; height: 10px; border-radius: 3px; vertical-align: -1px; }
.pill-b { background: var(--series-b); } .pill-j { background: var(--series-j); }

.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.label { font-size: 13.5px; font-weight: 600; color: var(--text-2); }
.req { color: var(--critical); }
.help { font-size: 12px; color: var(--muted); }
.err-msg { font-size: 12.5px; color: var(--critical); min-height: 0; }
.err-msg:empty { display: none; }
.input, select.input, textarea.input {
  width: 100%; min-height: 44px; padding: 10px 13px; border-radius: 12px; border: 1px solid var(--border);
  background: var(--surface-sunk); box-shadow: var(--neu-in); outline: none; transition: border-color .15s, box-shadow .15s;
}
textarea.input { min-height: 96px; resize: vertical; }
.input:focus { border-color: color-mix(in srgb, var(--brand-2) 60%, transparent); box-shadow: var(--neu-in), 0 0 0 3px color-mix(in srgb, var(--brand-2) 18%, transparent); }
.field.has-err .input, .input.bad { border-color: var(--critical); box-shadow: var(--neu-in), 0 0 0 3px color-mix(in srgb, var(--critical) 14%, transparent); }
.form-grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 16px 18px; }
.form-grid > .field { grid-column: span 6; }
.form-grid > .field.span-12 { grid-column: span 12; }
.form-grid > .field.span-4 { grid-column: span 4; }
.form-grid > .field.span-3 { grid-column: span 3; }
.num-input { display: flex; align-items: stretch; gap: 6px; }
.num-input .input { text-align: center; }
.num-input button { width: 44px; flex: none; border-radius: 12px; border: 1px solid var(--border); background: var(--surface-2); box-shadow: var(--neu-out); cursor: pointer; font-size: 18px; font-weight: 600; }

/* ตัวเลือกแบบการ์ด (radio / checkbox / rating) */
.choice-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: 9px; }
.choice-grid.wide { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
.choice {
  display: flex; flex-direction: column; align-items: flex-start; gap: 2px; text-align: left; padding: 11px 13px; min-height: 46px;
  border-radius: 13px; border: 1.5px solid var(--border); background: var(--surface-2); cursor: pointer; box-shadow: var(--neu-out);
  transition: border-color .15s, background .15s, transform .12s;
}
.choice:hover { border-color: color-mix(in srgb, var(--brand-2) 45%, transparent); }
.choice.on { border-color: var(--brand-2); background: color-mix(in srgb, var(--brand-2) 10%, var(--surface-solid)); box-shadow: none; }
.choice.on > span:first-child::before { content: '✓ '; color: var(--brand-2); font-weight: 700; }
.choice span { font-weight: 600; font-size: 14px; }
.choice small { font-size: 12px; color: var(--muted); line-height: 1.4; }
.rating { display: flex; gap: 8px; flex-wrap: wrap; }
.rating .choice { align-items: center; min-width: 46px; }

.stepper { display: inline-flex; align-items: center; border-radius: 12px; background: var(--surface-sunk); box-shadow: var(--neu-in); padding: 3px; }
.stepper button { width: 32px; height: 32px; border: 0; border-radius: 9px; background: var(--surface-solid); box-shadow: var(--shadow-sm); cursor: pointer; font-size: 17px; font-weight: 600; color: var(--text-2); }
.stepper button:hover { color: var(--brand-2); }
.stepper input { width: 52px; height: 32px; border: 0; background: transparent; text-align: center; font-weight: 700; font-size: 15px; outline: none; font-variant-numeric: tabular-nums; }
.stepper input.bad { color: var(--critical); }
.stepper:focus-within { box-shadow: var(--neu-in), 0 0 0 2px color-mix(in srgb, var(--brand-2) 40%, transparent); }

.progress { height: 8px; border-radius: 99px; background: var(--surface-sunk); overflow: hidden; box-shadow: var(--neu-in); }
.progress > span { display: block; height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--brand-2), var(--brand-1)); transition: width .3s; }
.hbar { height: 7px; border-radius: 99px; background: var(--surface-sunk); overflow: hidden; }
.hbar > span { display: block; height: 100%; border-radius: 99px; background: var(--series-j); }
.hbar.b > span { background: var(--series-b); }

.banner { display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; border-radius: 14px; font-size: 13.5px; border: 1px solid var(--border); background: var(--surface-2); }
.banner .ico { margin-top: 2px; }
.banner.info { background: color-mix(in srgb, var(--brand-2) 9%, var(--surface-solid)); border-color: color-mix(in srgb, var(--brand-2) 25%, transparent); }
.banner.warn { background: color-mix(in srgb, var(--warn) 13%, var(--surface-solid)); border-color: color-mix(in srgb, var(--warn) 40%, transparent); }
.banner.crit { background: color-mix(in srgb, var(--critical) 9%, var(--surface-solid)); border-color: color-mix(in srgb, var(--critical) 30%, transparent); }
.banner.good { background: color-mix(in srgb, var(--good) 9%, var(--surface-solid)); border-color: color-mix(in srgb, var(--good) 28%, transparent); }
.banner b { font-weight: 700; }
.banner .banner-actions { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }

.table-wrap { overflow: auto; border-radius: 14px; border: 1px solid var(--border); background: var(--surface-solid); max-width: 100%; }
table.tbl { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 13.5px; }
.tbl th, .tbl td { padding: 9px 12px; text-align: left; border-bottom: 1px solid var(--grid); vertical-align: middle; }
.tbl th { position: sticky; top: 0; z-index: 1; background: var(--surface-2); font-weight: 600; color: var(--text-2); font-size: 12.5px; white-space: nowrap; }
.tbl th.sortable { cursor: pointer; user-select: none; }
.tbl th.sortable:hover { color: var(--text); }
.tbl th .sort-ind { opacity: .55; font-size: 10px; margin-left: 3px; }
.tbl td.r, .tbl th.r { text-align: right; font-variant-numeric: tabular-nums; }
.tbl td.c, .tbl th.c { text-align: center; }
.tbl tbody tr:hover td { background: color-mix(in srgb, var(--brand-2) 5%, transparent); }
.tbl tbody tr.clickable { cursor: pointer; }
.tbl tfoot td { font-weight: 700; background: var(--surface-2); border-bottom: 0; }
.tbl .name-cell { min-width: 220px; }
.tbl .muted { color: var(--muted); }
.tbl .code { white-space: nowrap; }
.empty { padding: 30px 16px; text-align: center; color: var(--muted); font-size: 14px; }

.toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.search { position: relative; flex: 1 1 220px; min-width: 180px; }
.search .ico { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); width: 18px; height: 18px; }
.search .input { padding-left: 38px; }
.seg { display: inline-flex; padding: 3px; border-radius: 12px; background: var(--surface-sunk); box-shadow: var(--neu-in); gap: 2px; }
.seg button { border: 0; background: transparent; padding: 6px 12px; border-radius: 9px; font-size: 13px; font-weight: 600; color: var(--text-2); cursor: pointer; white-space: nowrap; }
.seg button.on { background: var(--surface-solid); color: var(--text); box-shadow: var(--shadow-sm); }

/* =====================================================================
   5) ENTRY PAGE — ขั้นตอน / รายวัน / รายเดือน
   ===================================================================== */
.entry-hero { display: flex; gap: 18px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.entry-hero h2 { font-size: 19px; }
.entry-hero p { color: var(--muted); font-size: 13.5px; }
.progress-box { flex: 1 1 260px; max-width: 420px; }
.progress-box .p-top { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--text-2); margin-bottom: 6px; }
.steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 16px; }
.step-btn { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 14px; border: 1px solid var(--border); background: var(--surface-2); cursor: pointer; text-align: left; }
.step-btn .n { width: 30px; height: 30px; flex: none; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 14px; background: var(--surface-sunk); color: var(--text-2); box-shadow: var(--neu-in); }
.step-btn b { display: block; font-size: 13.5px; }
.step-btn small { color: var(--muted); font-size: 12px; }
.step-btn.on { border-color: var(--brand-2); background: color-mix(in srgb, var(--brand-2) 9%, var(--surface-solid)); }
.step-btn.on .n { background: var(--brand-2); color: #fff; box-shadow: none; }
.step-btn.done .n { background: color-mix(in srgb, var(--good) 18%, var(--surface-solid)); color: var(--good-text); }
.entry-grid { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 18px; margin-top: 18px; align-items: start; }
.entry-side { position: sticky; top: 16px; display: flex; flex-direction: column; gap: 14px; }
/* โหมดรายเดือน: ให้ตารางกว้างเต็มจอ ย้ายแผงสรุปลงด้านล่าง */
.entry-grid.wide { grid-template-columns: minmax(0, 1fr); }
.entry-grid.wide .entry-side { position: static; flex-direction: row; flex-wrap: wrap; }
.entry-grid.wide .entry-side > .card { flex: 1 1 300px; }
.stat-list { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.stat { padding: 10px 12px; border-radius: 13px; background: var(--surface-2); border: 1px solid var(--border); }
.stat small { display: block; font-size: 12px; color: var(--muted); }
.stat b { font-size: 17px; }
.stat.wide { grid-column: span 2; }
.day-strip { display: grid; grid-template-columns: repeat(auto-fill, minmax(40px, 1fr)); gap: 6px; }
.day-btn { position: relative; height: 40px; border-radius: 11px; border: 1px solid var(--border); background: var(--surface-2); cursor: pointer; font-weight: 600; font-variant-numeric: tabular-nums; }
.day-btn:hover { border-color: var(--brand-2); }
.day-btn.on { background: var(--brand-2); color: #fff; border-color: var(--brand-2); box-shadow: 0 8px 16px -8px var(--brand-2); }
.day-btn.has::after { content: ''; position: absolute; bottom: 4px; left: 50%; width: 5px; height: 5px; margin-left: -2.5px; border-radius: 50%; background: var(--series-j); }
.day-btn.on.has::after { background: #fff; }
.day-btn.today { outline: 2px solid color-mix(in srgb, var(--brand-1) 55%, transparent); outline-offset: -2px; }
.daily-tools { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin: 14px 0 12px; }
.drug-list { display: flex; flex-direction: column; gap: 8px; }
.drug-row {
  display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 6px 12px; align-items: center;
  padding: 10px 12px; border-radius: 15px; background: var(--surface-solid); border: 1px solid var(--border);
}
.drug-row.filled { border-color: color-mix(in srgb, var(--brand-2) 35%, transparent); background: color-mix(in srgb, var(--brand-2) 4%, var(--surface-solid)); }
.drug-row.warn { border-color: color-mix(in srgb, var(--serious) 60%, transparent); }
.drug-no { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; font-size: 12px; font-weight: 700; color: var(--brand-2); background: color-mix(in srgb, var(--brand-2) 11%, transparent); }
.drug-name { font-weight: 600; font-size: 14px; word-break: break-word; }
.drug-meta { font-size: 12px; color: var(--muted); }
.qty-pair { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }
.qty { display: flex; align-items: center; gap: 6px; }
.qty-tag { font-size: 12px; font-weight: 700; padding: 3px 8px; border-radius: 8px; white-space: nowrap; }
.qty-tag.b { color: var(--series-b); background: color-mix(in srgb, var(--series-b) 12%, transparent); }
.qty-tag.j { color: var(--series-j); background: color-mix(in srgb, var(--series-j) 12%, transparent); }
:root[data-theme="light"] .qty-tag.j { color: #c2286f; }
.mini-btn { border: 1px solid var(--border-strong); background: transparent; border-radius: 9px; padding: 5px 9px; font-size: 12px; font-weight: 600; cursor: pointer; color: var(--text-2); white-space: nowrap; }
.mini-btn:hover { color: var(--brand-2); border-color: var(--brand-2); }
.drug-sub { grid-column: 2 / -1; font-size: 12px; color: var(--muted); }
.day-sum { display: flex; gap: 16px; flex-wrap: wrap; padding: 12px 14px; margin-top: 12px; border-radius: 14px; background: var(--surface-2); font-size: 13.5px; }
.day-sum b { font-variant-numeric: tabular-nums; }

/* ตารางรายเดือน (เหมือนแบบฟอร์มต้นฉบับ) */
.mgrid-wrap { overflow: auto; max-height: 70vh; border-radius: 14px; border: 1px solid var(--border); background: var(--surface-solid); }
table.mgrid { border-collapse: separate; border-spacing: 0; font-size: 12.5px; }
.mgrid th, .mgrid td { border-right: 1px solid var(--grid); border-bottom: 1px solid var(--grid); padding: 0; text-align: center; white-space: nowrap; }
.mgrid thead th { position: sticky; z-index: 2; background: var(--surface-2); font-weight: 600; color: var(--text-2); padding: 5px 4px; }
.mgrid thead tr:nth-child(1) th { top: 0; }
.mgrid thead tr:nth-child(2) th { top: 29px; }
.mgrid .stk { position: sticky; z-index: 1; background: var(--surface-solid); }
.mgrid thead .stk { z-index: 3; background: var(--surface-2); }
.mgrid .c-no { left: 0; min-width: 40px; }
.mgrid .c-name { left: 40px; min-width: 230px; max-width: 230px; text-align: left; padding: 4px 8px; white-space: normal; line-height: 1.3; box-shadow: 1px 0 0 var(--border-strong); }
.mgrid td.c-name { font-weight: 600; }
.mgrid input { width: 40px; height: 30px; border: 0; background: transparent; text-align: center; font-variant-numeric: tabular-nums; outline: none; font-size: 12.5px; }
.mgrid input.w-lg { width: 70px; }
.mgrid input.w-name { width: 210px; text-align: left; }
.mgrid input:focus { background: color-mix(in srgb, var(--brand-2) 12%, transparent); box-shadow: inset 0 0 0 2px var(--brand-2); }
.mgrid input.bad { color: var(--critical); background: color-mix(in srgb, var(--critical) 10%, transparent); }
.mgrid input.has { font-weight: 700; color: var(--text); }
.mgrid .sub-b { color: var(--series-b); }
.mgrid .sub-j { color: var(--series-j); }
.mgrid td.tot { padding: 0 8px; font-weight: 700; font-variant-numeric: tabular-nums; background: var(--surface-2); }
.mgrid tr.day-off td.dcell, .mgrid th.day-off { background: var(--surface-sunk); }
.mgrid tfoot td { padding: 8px; font-weight: 700; background: var(--surface-2); position: sticky; bottom: 0; }
.mgrid .dsep { border-left: 1px solid var(--border-strong); }

.action-bar {
  position: sticky; bottom: 12px; z-index: 20; margin-top: 18px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
  padding: 12px 14px; border-radius: 18px; background: var(--surface); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
  border: 1px solid var(--border); box-shadow: var(--shadow);
}
.action-bar .spacer { flex: 1; }
.review-list { display: flex; flex-direction: column; gap: 8px; margin: 0; padding: 0; list-style: none; }
.review-list li { display: flex; gap: 10px; align-items: flex-start; font-size: 13.5px; padding: 9px 12px; border-radius: 12px; background: var(--surface-2); }
.review-list li .ico { margin-top: 2px; }
.review-list .crit .ico { color: var(--critical); }
.review-list .warn .ico { color: var(--serious); }
.review-list .good .ico { color: var(--good-text); }
.link-btn { border: 0; background: none; color: var(--brand-2); font-weight: 600; cursor: pointer; padding: 0; text-decoration: underline; text-underline-offset: 2px; }
.draft-item { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 11px; background: var(--surface-2); font-size: 12.5px; }
.draft-item .grow { flex: 1; min-width: 0; }

/* =====================================================================
   6) DASHBOARD
   ===================================================================== */
.filters { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; align-items: end; }
.filters .field .label { font-size: 12px; }
.filters .input { min-height: 40px; padding: 8px 11px; font-size: 13.5px; }
.filter-card { margin-bottom: 18px; }
.filter-summary { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 10px; font-size: 12.5px; color: var(--muted); }
.dash-grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 18px; }
.span-3 { grid-column: span 3; } .span-4 { grid-column: span 4; } .span-5 { grid-column: span 5; }
.span-6 { grid-column: span 6; } .span-7 { grid-column: span 7; } .span-8 { grid-column: span 8; } .span-12 { grid-column: span 12; }
.kpi { display: flex; flex-direction: column; gap: 4px; position: relative; overflow: hidden; }
.kpi .k-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.kpi .k-label { font-size: 13.5px; font-weight: 600; }
.kpi .k-chip { font-size: 11.5px; color: var(--muted); }
.kpi .k-value { font-size: 28px; font-weight: 700; letter-spacing: -.01em; line-height: 1.15; margin-top: 4px; }
.kpi .k-value small { font-size: 14px; font-weight: 600; color: var(--muted); margin-left: 4px; }
.kpi .k-foot { font-size: 12.5px; color: var(--muted); display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.kpi .k-spark { height: 46px; margin: 8px -4px -4px; }
.kpi-ring { display: flex; align-items: center; gap: 14px; }
.delta-up { color: var(--critical); font-weight: 600; }
.delta-down { color: var(--good-text); font-weight: 600; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12.5px; color: var(--text-2); align-items: center; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.viz { position: relative; width: 100%; }
.viz svg { display: block; overflow: visible; }
.viz svg:focus { outline: none; }
.viz svg:focus-visible { outline: 2px solid var(--brand-2); outline-offset: 4px; border-radius: 6px; }
.v-grid { stroke: var(--grid); stroke-width: 1; shape-rendering: crispEdges; }
.v-axis { stroke: var(--axis); stroke-width: 1; shape-rendering: crispEdges; }
.v-tick { fill: var(--muted); font-size: 11px; font-family: var(--font); font-variant-numeric: tabular-nums; }
.v-dlabel { font-size: 11.5px; font-weight: 600; fill: var(--text-2); font-family: var(--font); }
.v-cross { stroke: var(--axis); stroke-width: 1; }
.v-bar { transition: opacity .15s; }
.v-bars.hovering .v-bar { opacity: .4; }
.v-bars.hovering .v-bar.hot { opacity: 1; }
.viz-tip {
  position: fixed; z-index: 1000; pointer-events: none; min-width: 140px; max-width: 280px; padding: 9px 12px; border-radius: 12px;
  background: var(--surface-solid); color: var(--text); border: 1px solid var(--border-strong); box-shadow: var(--shadow); font-size: 12.5px; line-height: 1.5;
}
.viz-tip .tt-title { font-weight: 700; margin-bottom: 3px; }
.viz-tip .tt-row { display: flex; align-items: center; gap: 8px; justify-content: space-between; }
.viz-tip .tt-row span:first-child { display: inline-flex; align-items: center; gap: 6px; color: var(--text-2); }
.viz-tip .tt-row b { font-variant-numeric: tabular-nums; }
.viz-tip .tt-hint { color: var(--muted); font-size: 11.5px; margin-top: 4px; }
.top-list { display: flex; flex-direction: column; gap: 4px; }
.top-item { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; gap: 4px 10px; align-items: center; padding: 7px 8px; border-radius: 12px; cursor: pointer; border: 0; background: transparent; text-align: left; width: 100%; }
.top-item:hover { background: var(--surface-2); }
.top-item .rank { width: 24px; height: 24px; border-radius: 8px; display: grid; place-items: center; font-size: 12px; font-weight: 700; background: var(--surface-sunk); color: var(--text-2); }
.top-item .t-name { font-size: 13.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top-item .t-val { font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; text-align: right; }
.top-item .hbar { grid-column: 2 / -1; }
.top-item .t-sub { grid-column: 2 / -1; font-size: 11.5px; color: var(--muted); margin-top: -2px; }
.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
.cal .dow { font-size: 11.5px; color: var(--muted); text-align: center; padding-bottom: 2px; }
.cal button { aspect-ratio: 1 / 1; min-height: 32px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface-2); font-size: 12.5px; font-weight: 600; cursor: pointer; color: var(--text); font-variant-numeric: tabular-nums; padding: 0; }
.cal button:disabled { cursor: default; opacity: .5; }
.cal .l1 { background: color-mix(in srgb, var(--series-j) 18%, var(--surface-solid)); }
.cal .l2 { background: color-mix(in srgb, var(--series-j) 38%, var(--surface-solid)); }
.cal .l3 { background: color-mix(in srgb, var(--series-j) 64%, var(--surface-solid)); color: #fff; }
.cal .l4 { background: color-mix(in srgb, var(--series-j) 92%, var(--surface-solid)); color: #fff; }
.cal .blank { visibility: hidden; }
.cal-legend { display: flex; align-items: center; gap: 4px; font-size: 11.5px; color: var(--muted); margin-top: 10px; }
.cal-legend i { width: 16px; height: 10px; border-radius: 3px; display: inline-block; border: 1px solid var(--border); }
.alert-list { display: flex; flex-direction: column; gap: 8px; }
.alert-item { display: flex; gap: 10px; padding: 10px 12px; border-radius: 13px; background: var(--surface-2); font-size: 13px; cursor: pointer; border: 0; text-align: left; width: 100%; color: var(--text); }
.alert-item:hover { background: var(--surface-sunk); }
.alert-item .ico { margin-top: 1px; }
.alert-item.crit .ico { color: var(--critical); }
.alert-item.warn .ico { color: var(--serious); }
.alert-item.info .ico { color: var(--brand-2); }
.alert-item b { display: block; font-size: 13.5px; }
.alert-item small { color: var(--muted); }
.loading-hold { opacity: .55; pointer-events: none; transition: opacity .2s; }

/* =====================================================================
   7) ADMIN
   ===================================================================== */
.login-wrap { min-height: 60vh; display: grid; place-items: center; }
.login-card { width: min(420px, 100%); padding: 28px; }
.login-card .lock-ico { width: 54px; height: 54px; border-radius: 16px; display: grid; place-items: center; margin-bottom: 14px; color: #fff; background: linear-gradient(135deg, var(--brand-2), var(--brand-1)); }
.login-card .lock-ico .ico { width: 26px; height: 26px; }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 16px; }
.tab { display: inline-flex; align-items: center; gap: 8px; padding: 9px 15px; border-radius: 12px; border: 1px solid var(--border); background: var(--surface); cursor: pointer; font-weight: 600; font-size: 13.5px; color: var(--text-2); }
.tab.on { background: var(--brand-2); color: #fff; border-color: var(--brand-2); }
.row-actions { display: flex; gap: 4px; justify-content: flex-end; }
.kv { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
.kv div { padding: 9px 12px; border-radius: 12px; background: var(--surface-2); font-size: 13px; }
.kv small { display: block; color: var(--muted); font-size: 11.5px; }
.kv b { word-break: break-word; }
.settings-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
.file-drop { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 26px; border-radius: 16px; border: 2px dashed var(--border-strong); background: var(--surface-2); text-align: center; cursor: pointer; }
.file-drop:hover, .file-drop.drag { border-color: var(--brand-2); }
.code { font-family: ui-monospace, Consolas, monospace; font-size: 12.5px; background: var(--surface-sunk); padding: 2px 6px; border-radius: 6px; word-break: break-all; }

/* =====================================================================
   8) MODAL / TOAST / BUSY
   ===================================================================== */
.modal-back { position: fixed; inset: 0; z-index: 500; display: grid; place-items: center; padding: 18px; background: rgba(20, 14, 40, .42); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); animation: fade .15s ease-out; }
.modal { width: min(560px, 100%); max-height: calc(100vh - 36px); display: flex; flex-direction: column; border-radius: 22px; background: var(--surface-solid); border: 1px solid var(--border); box-shadow: 0 30px 70px -20px rgba(0,0,0,.45); animation: pop .18s ease-out; }
.modal.lg { width: min(900px, 100%); }
.modal.xl { width: min(1280px, 100%); }
.modal-head { display: flex; align-items: center; gap: 12px; padding: 16px 20px; border-bottom: 1px solid var(--border); }
.modal-head h3 { font-size: 17px; flex: 1; }
.modal-body { padding: 18px 20px; overflow: auto; }
.modal-foot { display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; padding: 14px 20px; border-top: 1px solid var(--border); }
@keyframes fade { from { opacity: 0; } }
@keyframes pop { from { opacity: 0; transform: translateY(8px) scale(.98); } }
#toastRoot { position: fixed; z-index: 900; right: 18px; bottom: 18px; display: flex; flex-direction: column; gap: 10px; max-width: min(420px, calc(100vw - 36px)); }
.toast { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: 14px; background: var(--surface-solid); border: 1px solid var(--border-strong); box-shadow: var(--shadow); font-size: 13.5px; animation: pop .2s ease-out; }
.toast.good .ico { color: var(--good-text); } .toast.error .ico { color: var(--critical); } .toast.warn .ico { color: var(--serious); } .toast.info .ico { color: var(--brand-2); }
.toast .t-close { margin-left: auto; border: 0; background: none; cursor: pointer; color: var(--muted); padding: 0 2px; }
.busy { position: fixed; inset: 0; z-index: 950; display: grid; place-content: center; justify-items: center; gap: 14px; background: rgba(20, 14, 40, .35); backdrop-filter: blur(3px); color: #fff; font-weight: 600; }
.spinner { width: 44px; height: 44px; border-radius: 50%; border: 4px solid rgba(255,255,255,.35); border-top-color: #fff; animation: spin .8s linear infinite; }
.spinner.sm { width: 18px; height: 18px; border-width: 2px; border-color: color-mix(in srgb, var(--brand-2) 30%, transparent); border-top-color: var(--brand-2); }
@keyframes spin { to { transform: rotate(360deg); } }
.success-ico { width: 64px; height: 64px; margin: 4px auto 12px; border-radius: 50%; display: grid; place-items: center; color: #fff; background: linear-gradient(135deg, var(--good), #2fbf6f); }
.success-ico .ico { width: 32px; height: 32px; stroke-width: 2.4; }

/* =====================================================================
   9) MOBILE — Bottom navigation + ปรับ grid
   ===================================================================== */
.bottom-nav { display: none; }
@media (max-width: 1200px) {
  .span-3 { grid-column: span 6; } .span-4 { grid-column: span 6; } .span-5, .span-7, .span-8 { grid-column: span 12; }
  .entry-grid { grid-template-columns: minmax(0, 1fr); }
  .entry-side { position: static; }
}
@media (max-width: 900px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .sidebar { display: none; }
  .main { padding: 16px 16px 96px; }
  .topbar h1 { font-size: 20px; }
  .topbar .hide-sm { display: none; }
  .bottom-nav {
    display: grid; grid-template-columns: repeat(4, 1fr); position: fixed; left: 10px; right: 10px; bottom: 10px; z-index: 400;
    padding: 6px; border-radius: 20px; background: var(--surface); backdrop-filter: blur(20px) saturate(150%); -webkit-backdrop-filter: blur(20px) saturate(150%);
    border: 1px solid var(--border); box-shadow: var(--shadow); padding-bottom: calc(6px + env(safe-area-inset-bottom));
  }
  .bottom-nav a, .bottom-nav button { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 7px 4px; border-radius: 14px; font-size: 11.5px; font-weight: 600; color: var(--text-2); text-decoration: none; background: none; border: 0; cursor: pointer; }
  .bottom-nav a.active { color: var(--brand-1); background: color-mix(in srgb, var(--brand-1) 11%, transparent); }
  .form-grid > .field, .form-grid > .field.span-4, .form-grid > .field.span-3 { grid-column: span 12; }
  .settings-grid { grid-template-columns: minmax(0, 1fr); }
  .action-bar { bottom: 84px; }
  #toastRoot { bottom: 96px; left: 16px; right: 16px; }
}
@media (max-width: 640px) {
  .span-3, .span-4, .span-6 { grid-column: span 12; }
  .dash-grid { gap: 14px; }
  .kpi-row .span-3 { grid-column: span 6; }
  .kpi .k-value { font-size: 22px; }
  .steps { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .step-btn { flex-direction: column; text-align: center; padding: 8px 6px; gap: 4px; }
  .step-btn small { display: none; }
  .drug-row { grid-template-columns: 30px minmax(0, 1fr); }
  .qty-pair { grid-column: 1 / -1; justify-content: space-between; }
  .drug-sub { grid-column: 1 / -1; }
  .card { padding: 15px 14px; border-radius: 18px; }
  .action-bar { gap: 8px; padding: 10px; }
  .action-bar .btn { flex: 1 1 auto; padding: 10px 12px; }
  .action-bar .btn-ghost { flex: 0 0 44px; padding: 0; }
  .action-bar .btn-ghost .lbl { display: none; }
  .action-bar .spacer { display: none; }
  .kpi-ring { flex-wrap: wrap; }
  .modal-back { padding: 0; align-items: end; }
  .modal { max-height: 92vh; border-radius: 22px 22px 0 0; }
}

/* =====================================================================
   10) PRINT / PDF
   ===================================================================== */
@media print {
  @page { size: A4 landscape; margin: 10mm; }
  :root { --surface: #fff; --surface-solid: #fff; --surface-2: #f6f6f6; --bg: #fff; --shadow: none; --neu-in: none; --neu-out: none; }
  body { background: #fff; font-size: 12px; }
  .bg-deco, .sidebar, .bottom-nav, .no-print, .action-bar, #toastRoot, .topbar-right, .filter-card .filters { display: none !important; }
  .app { display: block; }
  .main { padding: 0; }
  .card { box-shadow: none; backdrop-filter: none; border: 1px solid #ddd; break-inside: avoid; }
  .dash-grid { gap: 10px; }
  .mgrid-wrap, .table-wrap { max-height: none; overflow: visible; }
  body.print-modal .app { display: none; }

const $ = (s, r = document) => r.querySelector(s);

const pad2 = n => String(n).padStart(2, '0');
const isBlank = v => v === '' || v === null || v === undefined;
const num = v => (isBlank(v) || isNaN(Number(v))) ? 0 : Number(v);
const round2 = n => Math.round((Number(n) + Number.EPSILON) * 100) / 100;
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

const makeStorage = area => ({

  get(k, d = null) { try { const v = window[area].getItem(this.key(k)); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { window[area].setItem(this.key(k), JSON.stringify(v)); return true; } catch (e) { return false; } },
  del(k) { try { window[area].removeItem(this.key(k)); } catch (e) { /* ignore */ } },
});

/** SHA-256 (pure JS — ใช้ได้ทั้ง file:// และ http) คืนค่า hex */
function sha256Hex(str) {
  const bytes = new TextEncoder().encode(str);
  const K = new Uint32Array([0x428a2f98, 0x71374491, 0xb5c0fbcf, 0xe9b5dba5, 0x3956c25b, 0x59f111f1, 0x923f82a4, 0xab1c5ed5, 0xd807aa98, 0x12835b01, 0x243185be, 0x550c7dc3, 0x72be5d74, 0x80deb1fe, 0x9bdc06a7, 0xc19bf174, 0xe49b69c1, 0xefbe4786, 0x0fc19dc6, 0x240ca1cc, 0x2de92c6f, 0x4a7484aa, 0x5cb0a9dc, 0x76f988da, 0x983e5152, 0xa831c66d, 0xb00327c8, 0xbf597fc7, 0xc6e00bf3, 0xd5a79147, 0x06ca6351, 0x14292967, 0x27b70a85, 0x2e1b2138, 0x4d2c6dfc, 0x53380d13, 0x650a7354, 0x766a0abb, 0x81c2c92e, 0x92722c85, 0xa2bfe8a1, 0xa81a664b, 0xc24b8b70, 0xc76c51a3, 0xd192e819, 0xd6990624, 0xf40e3585, 0x106aa070, 0x19a4c116, 0x1e376c08, 0x2748774c, 0x34b0bcb5, 0x391c0cb3, 0x4ed8aa4a, 0x5b9cca4f, 0x682e6ff3, 0x748f82ee, 0x78a5636f, 0x84c87814, 0x8cc70208, 0x90befffa, 0xa4506ceb, 0xbef9a3f7, 0xc67178f2]);
  const H = new Uint32Array([0x6a09e667, 0xbb67ae85, 0x3c6ef372, 0xa54ff53a, 0x510e527f, 0x9b05688c, 0x1f83d9ab, 0x5be0cd19]);
  const len = bytes.length, total = ((len + 9 + 63) >> 6) << 6;
  const buf = new Uint8Array(total); buf.set(bytes); buf[len] = 0x80;
  const dv = new DataView(buf.buffer);
  dv.setUint32(total - 4, (len * 8) >>> 0); dv.setUint32(total - 8, Math.floor(len / 0x20000000));
  const W = new Uint32Array(64);
  for (let off = 0; off < total; off += 64) {
    for (let i = 0; i < 16; i++) W[i] = dv.getUint32(off + i * 4);
    for (let i = 16; i < 64; i++) {
      const x = W[i - 15], y = W[i - 2];
      const s0 = ((x >>> 7) | (x << 25)) ^ ((x >>> 18) | (x << 14)) ^ (x >>> 3);
      const s1 = ((y >>> 17) | (y << 15)) ^ ((y >>> 19) | (y << 13)) ^ (y >>> 10);
      W[i] = (W[i - 16] + s0 + W[i - 7] + s1) | 0;
    }
    let a = H[0], b = H[1], c = H[2], d = H[3], e = H[4], f = H[5], g = H[6], h = H[7];
    for (let i = 0; i < 64; i++) {
      const S1 = ((e >>> 6) | (e << 26)) ^ ((e >>> 11) | (e << 21)) ^ ((e >>> 25) | (e << 7));
      const t1 = (h + S1 + ((e & f) ^ (~e & g)) + K[i] + W[i]) | 0;
      const S0 = ((a >>> 2) | (a << 30)) ^ ((a >>> 13) | (a << 19)) ^ ((a >>> 22) | (a << 10));
      const t2 = (S0 + ((a & b) ^ (a & c) ^ (b & c))) | 0;
      h = g; g = f; f = e; e = (d + t1) | 0; d = c; c = b; b = a; a = (t1 + t2) | 0;
    }
    H[0] += a; H[1] += b; H[2] += c; H[3] += d; H[4] += e; H[5] += f; H[6] += g; H[7] += h;
  }
  return Array.from(H, x => x.toString(16).padStart(8, '0')).join('');
}
const hashPassword = pw => sha256Hex(CONFIG.PASSWORD_SALT + pw);
