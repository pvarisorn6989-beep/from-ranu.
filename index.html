      ${st.step > 0 ? `<button type="button" class="btn btn-primary" data-a="save" id="btnSave" ${locked ? 'disabled' : ''}>${icon('save')} บันทึก</button>` : ''}`;
    bar.onclick = e => {
      const b = e.target.closest('[data-a]'); if (!b || b.disabled) return;
      ({ back: () => this.goStep(st.step - 1), next: () => this.goStep(st.step + 1), clear: () => this.clear(), new: () => this.startNew(), draft: () => this.saveDraft(), save: () => this.save() })[b.dataset.a]();
    };
  },
  goStep(n) {
    const st = this.st;
    n = clamp(n, 0, 2);
    if (n > st.step && st.step === 0) {
      st.errs = FormKit.validate(HEADER_FIELDS, st.v);
      if (Object.keys(st.errs).length) { this.renderStep(); UI.toast('กรุณากรอกข้อมูลให้ครบถ้วนก่อนไปขั้นตอนถัดไป', 'warn'); const f = $('#entryMain .has-err input, #entryMain .has-err .choice'); f && f.focus(); return; }
      if (this.periodKey() !== st.loadedKey) this.loadPeriod();
    }
    st.step = n; this.syncHeader(); this.render(); window.scrollTo({ top: 0, behavior: 'smooth' });
  },
  updateProgress() {
    const st = this.st, v = st.v, w = st.work; if (!w) return;
    const req = HEADER_FIELDS.filter(f => f.required);
    let done = req.filter(f => !isBlank(v[f.key]) && String(v[f.key]).trim() !== '').length;
    const hasQty = w.items.some(i => num(i.total_b) || num(i.total_j));
    if (hasQty) done++;
    if (hasQty && !Engine.validate(w, w.items).length) done++;
    const pct = Math.round(done / (req.length + 2) * 100);
    const t = $('#pgText'), b = $('#pgBar'), r = $('#pgRole');
    if (t) t.textContent = pct + '%'; if (b) b.style.width = pct + '%'; if (r) r.setAttribute('aria-valuenow', pct);
  },
  snapshot() { const st = this.st; this.syncHeader(); return { v: clone(st.v), work: clone(st.work), base: clone(st.base), orig: st.orig ? clone(st.orig) : null, day: st.day, step: st.step, saved_at: nowISO() }; },
  applySnapshot(s) { const st = this.st; Object.assign(st, { v: clone(s.v), work: clone(s.work), base: clone(s.base), orig: s.orig ? clone(s.orig) : null, day: s.day || 1, step: s.step || 1 }); st.loadedKey = this.periodKey(); },
  autosave: debounce(function () { if (this.dirty()) LS.set('autosave', this.snapshot()); else LS.del('autosave'); }, 800),
  saveDraft() {
    const s = this.snapshot(); s.id = uid(8);
    const drafts = LS.get('drafts', []).filter(d => !(d.v.report_month === s.v.report_month && d.v.report_year === s.v.report_year && normName(d.v.department) === normName(s.v.department)));
    drafts.unshift(s);
    if (!LS.set('drafts', drafts.slice(0, 10))) return UI.toast('บันทึกร่างไม่สำเร็จ (Local Storage เต็มหรือถูกปิด)', 'error');
    LS.del('autosave'); this.renderSide();
    UI.toast(`บันทึกร่าง ${periodLabel(s.v.report_month, s.v.report_year)} ไว้ในเครื่องนี้แล้ว (ยังไม่ส่งเข้าระบบ)`, 'good');
  },
  async clear() {
    if (!this.dirty()) return UI.toast('ไม่มีข้อมูลที่ยังไม่บันทึกให้ล้าง', 'info');
    if (!(await UI.confirm({ title: 'ล้างข้อมูล?', message: 'ยกเลิกการแก้ไขทั้งหมดที่ยังไม่บันทึก และกลับไปใช้ข้อมูลล่าสุดที่บันทึกไว้', confirmText: 'ล้างข้อมูล', danger: true }))) return;
    this.st.work = clone(this.st.base); LS.del('autosave'); this.render(); UI.toast('ล้างข้อมูลที่ยังไม่บันทึกแล้ว', 'info');
  },
  async startNew() {
    if (this.dirty() && !(await UI.confirm({ title: 'เริ่มรายการใหม่?', message: 'ข้อมูลที่ยังไม่บันทึกจะหายไป (หากต้องการเก็บไว้ ให้กด "บันทึกร่าง" ก่อน)', confirmText: 'เริ่มใหม่', danger: true }))) return;
    LS.del('autosave'); this.st = this.fresh(); await Data.refresh().catch(() => {}); this.loadPeriod(); this.render();
  },
  /** บันทึกเข้าระบบ (ป้องกันกดซ้ำด้วย st.saving + ปิดปุ่ม + record_id ที่สร้างไว้ล่วงหน้า) */
  async save() {
    const st = this.st;
    if (st.saving) return;
    this.syncHeader();
    st.errs = FormKit.validate(HEADER_FIELDS, st.v);
    if (Object.keys(st.errs).length) { st.step = 0; this.render(); return UI.toast('กรุณากรอกข้อมูลใบเบิกให้ครบถ้วน', 'warn'); }
    if (this.periodKey() !== st.loadedKey) { this.loadPeriod(); this.render(); return UI.toast('เปลี่ยนเดือน/หน่วยงานแล้ว กรุณาตรวจสอบข้อมูลอีกครั้ง', 'info'); }
    const w = st.work;
    const errs = Engine.validate(w, w.items);
    if (errs.length) { UI.modal({ title: 'ข้อมูลไม่ผ่านการตรวจสอบ', body: UI.errorHTML(new AppError('VALIDATION', `พบข้อผิดพลาด ${errs.length} จุด กรุณาแก้ไขก่อนบันทึก`, errs)), actions: [{ label: 'ตกลง', kind: 'btn-primary' }] }); return; }
    const patch = st.orig ? Editor.diff(st.base, w) : null;
    if (patch && !patch.count) return UI.toast('ไม่มีการเปลี่ยนแปลงที่ต้องบันทึก', 'info');
    const hasQty = w.items.some(i => num(i.total_b) || num(i.total_j));
    if (!st.orig && !hasQty && !(await UI.confirm({ title: 'ยังไม่มีการกรอกจำนวน', message: 'ต้องการสร้างใบเบิกเปล่าของเดือนนี้หรือไม่?', confirmText: 'สร้างใบเบิก' }))) return;
    const overs = Engine.warnings(w, w.items).filter(x => x.kind === 'over');
    if (overs.length && !(await UI.confirm({ title: 'พบรายการที่จ่ายมากกว่าเบิก', html: `<p>พบ ${overs.length} จุดที่ จ (จ่าย) มากกว่า บ (เบิก) เช่น</p><ul>${overs.slice(0, 5).map(o => `<li>${esc(o.message)}</li>`).join('')}</ul><p>ยืนยันบันทึกตามนี้หรือไม่?</p>`, confirmText: 'ยืนยันบันทึก' }))) return;

    st.saving = true;
    $$('#actionBar .btn').forEach(b => { b.disabled = true; });
    UI.busy(true, Store.kind === 'api' ? 'กำลังบันทึกไปยัง Google Sheets...' : 'กำลังบันทึก...');
    const user = sanitizeText(st.v.recorder, 80);
    let res, queued = false;
    try {
      if (!st.orig) {
        try { res = await Store.create(Editor.payloadHeader(w), Editor.payloadItems(w), user); }
        catch (e) {
          if (e.code !== 'DUPLICATE_PERIOD') throw e;
          // มีผู้อื่นสร้างใบเบิกเดือนนี้ไปก่อน → รวมข้อมูลเข้ากับใบเบิกนั้นแทน
          await Data.refresh();
          const ex = Data.findPeriod(w.department, w.report_year, w.report_month);
          if (!ex) throw e;
          res = await Store.update(ex.record_id, Editor.diff(ex, w), user);
        }
      } else {
        res = await Store.update(w.record_id, patch, user);
      }
    } catch (e) {
      if (Store.kind === 'api' && isNetErr(e)) {
        Outbox.push(st.orig ? { op: 'update', record_id: w.record_id, patch, user } : { op: 'create', record_id: w.record_id, record: Editor.payloadHeader(w), items: Editor.payloadItems(w), user });
        queued = true;
      } else {
        UI.busy(false); st.saving = false; this.renderActions();
        UI.modal({ title: 'บันทึกไม่สำเร็จ', body: UI.errorHTML(e), actions: [{ label: 'ตกลง', kind: 'btn-primary' }] });
        return;
      }
    }
    LS.del('autosave');
    if (!queued) { try { await Data.refresh(); } catch (e) { /* แสดงผลจากแคชเดิม */ } this.loadPeriod(); }
    else { st.base = clone(st.work); }
    st.saving = false; UI.busy(false); this.render(); UI.updateChrome();
    const rid = res?.record_id || w.record_id;
    const m = UI.modal({
      title: queued ? 'บันทึกไว้ในเครื่องแล้ว' : 'บันทึกสำเร็จ',
      body: `<div style="text-align:center"><div class="success-ico" style="${queued ? 'background:var(--warn)' : ''}">${icon(queued ? 'cloud' : 'check')}</div>
        <p style="font-size:16px;font-weight:700">${queued ? 'อินเทอร์เน็ต/API ขัดข้อง — ระบบจะส่งข้อมูลอัตโนมัติเมื่อเชื่อมต่อได้' : (res?.idempotent ? esc(res.message) : 'บันทึกข้อมูลเรียบร้อยแล้ว')}</p>
        <p style="color:var(--muted);margin-top:4px">รหัสใบเบิก <span class="code">${esc(rid)}</span> · ${esc(periodLabel(w.report_month, w.report_year))}${res?.changes ? ` · แก้ไข ${res.changes} ช่อง` : ''}</p></div>`,
      actions: [
        ...(st.v.entry_mode === 'daily' && st.day < daysInMonth(w.report_year, w.report_month) ? [{ label: `บันทึกวันที่ ${st.day + 1} ต่อ`, kind: 'btn-soft', onClick: () => { st.day++; st.step = 1; this.render(); } }] : []),
        { label: 'เริ่มรายการใหม่', kind: 'btn-ghost', onClick: () => { st.step = 0; this.render(); } },
        { label: 'ดู Dashboard', kind: 'btn-primary', icon: 'chart', onClick: () => { location.hash = '#/dashboard'; } },
      ],
    });
    return m;
  },
};

/* =======================================================================
 * 11) ANALYTICS — สรุปข้อมูลตามตัวกรอง (ใช้ใน Dashboard)
 * ======================================================================= */
const Analytics = {
  compute(records, f) {
    const q = normName(f.q);
    const from = f.from || '0000-00-00', to = f.to || '9999-99-99';
    const recs = records.filter(r => (f.fy === 'all' || fiscalYear(r.report_year, r.report_month) === Number(f.fy)) && (f.month === 'all' || Number(r.report_month) === Number(f.month)) && (f.dept === 'all' || r.department === f.dept) && (f.status === 'all' || r.record_status === f.status));
    const byDate = new Map(), byMonth = new Map(), byItem = new Map(), byUnit = new Map();
    const shortfalls = [], overs = [], T = { b: 0, j: 0, amt: 0 }, inRange = [];
    recs.forEach(r => {
      const y = Number(r.report_year), m = Number(r.report_month), dim = daysInMonth(y, m), ym = ymKey(y, m);
      if (dateKey(y, m, dim) < from || dateKey(y, m, 1) > to) return;
      inRange.push(r);
      if (!byMonth.has(ym)) byMonth.set(ym, { ym, y, m, b: 0, j: 0, amt: 0, recs: [] });
      const mo = byMonth.get(ym); mo.recs.push(r);
      r.items.forEach(it => {
        if (f.unit !== 'all' && String(it.unit || '').trim() !== f.unit) return;
        if (q && !normName(it.drug_name).includes(q)) return;
        const key = normName(it.drug_name);
        if (!byItem.has(key)) byItem.set(key, { key, name: it.drug_name, unit: it.unit, price: it.unit_price, stock: it.stock, item_no: Number(it.item_no), b: 0, j: 0, amt: 0, days: new Set(), lastYm: '' });
        const a = byItem.get(key);
        if (ym >= a.lastYm) Object.assign(a, { name: it.drug_name, unit: it.unit, price: it.unit_price, stock: it.stock, item_no: Number(it.item_no), lastYm: ym });
        const price = isBlank(it.unit_price) ? null : num(it.unit_price);
        DAY_KEYS.forEach(k => {
          if (k.d > dim) return;
          const b = num(it[k.b]), j = num(it[k.j]); if (!b && !j) return;
          const dk = dateKey(y, m, k.d); if (dk < from || dk > to) return;
          const amt = price == null ? 0 : price * j;
          T.b += b; T.j += j; T.amt += amt;
          a.b += b; a.j += j; a.amt += amt; a.days.add(dk);
          mo.b += b; mo.j += j; mo.amt += amt;
          if (!byDate.has(dk)) byDate.set(dk, { dk, b: 0, j: 0, amt: 0, n: 0 });
          const dd = byDate.get(dk); dd.b += b; dd.j += j; dd.amt += amt; dd.n++;
          const u = String(it.unit || '').trim() || '(ไม่ระบุ)';
          if (!byUnit.has(u)) byUnit.set(u, { unit: u, b: 0, j: 0, amt: 0, items: new Set() });
          const uu = byUnit.get(u); uu.b += b; uu.j += j; uu.amt += amt; uu.items.add(key);
          if (j < b) shortfalls.push({ dk, name: it.drug_name, key, b, j });
          if (j > b) overs.push({ dk, name: it.drug_name, key, b, j });
        });
      });
    });
    const items = [...byItem.values()].map(a => ({ ...a, amt: round2(a.amt), nDays: a.days.size }));
    const months = [...byMonth.values()].sort((a, b) => a.ym.localeCompare(b.ym));
    const daily = [];
    months.forEach(mo => {
      const dim = daysInMonth(mo.y, mo.m);
      for (let d = 1; d <= dim; d++) {
        const dk = dateKey(mo.y, mo.m, d); if (dk < from || dk > to) continue;
        const x = byDate.get(dk) || { b: 0, j: 0, amt: 0, n: 0 };
        daily.push({ dk, label: months.length > 1 ? `${d}/${mo.m}` : String(d), tip: dateKeyLabel(dk), ...x, dk_: dk });
      }
    });
    return {
      recs: inRange, T: { b: round2(T.b), j: round2(T.j), amt: round2(T.amt) }, byDate, months, daily, items,
      units: [...byUnit.values()].map(u => ({ ...u, nItems: u.items.size, amt: round2(u.amt) })).sort((a, b) => b.amt - a.amt),
      shortfalls, overs, noPrice: items.filter(a => a.j > 0 && isBlank(a.price)), unused: items.filter(a => !a.b && !a.j),
      activeDays: byDate.size,
    };
  },
};

    const rows = [...A.items].sort((a, b) => { const x = val(a, s.key), y = val(b, s.key); return (x > y ? 1 : x < y ? -1 : 0) * s.dir || a.item_no - b.item_no; });
    const th = (k, t, cls = '') => `<th class="sortable ${cls}" data-sort="${k}" aria-sort="${s.key === k ? (s.dir > 0 ? 'ascending' : 'descending') : 'none'}">${t}<span class="sort-ind">${s.key === k ? (s.dir > 0 ? '▲' : '▼') : '↕'}</span></th>`;
    $('#drugTable').innerHTML = `<div class="table-wrap" style="max-height:560px"><table class="tbl"><thead><tr>${th('item_no', 'ลำดับ')}${th('name', 'ประเภทเวชภัณฑ์ยา')}<th>หน่วย</th>${th('price', 'ราคา/หน่วย', 'r')}${th('stock', 'Stock', 'r')}${th('b', 'ยอดรวม บ', 'r')}${th('j', 'ยอดรวม จ', 'r')}${th('amt', 'รวมเงิน (บาท)', 'r')}${th('share', 'สัดส่วนมูลค่า')}${th('nDays', 'วันที่ใช้', 'r')}</tr></thead>
      <tbody>${rows.map(i => `<tr class="clickable" data-item="${esc(i.key)}"><td>${i.item_no}</td><td class="name-cell">${esc(i.name)}</td><td>${esc(i.unit || '–')}</td><td class="r">${isBlank(i.price) ? '<span class="badge crit">ไม่มีราคา</span>' : fmtMoney(i.price)}</td><td class="r">${isBlank(i.stock) ? '<span class="muted">–</span>' : fmtQty(i.stock)}</td><td class="r">${fmtQty(i.b)}</td><td class="r">${fmtQty(i.j)}</td><td class="r"><b>${fmtMoney(i.amt)}</b></td><td style="min-width:130px"><div style="display:flex;align-items:center;gap:8px"><div class="hbar" style="flex:1"><span style="width:${A.T.amt ? i.amt / A.T.amt * 100 : 0}%"></span></div><span class="tnum" style="font-size:12px;width:44px;text-align:right">${fmtPct(A.T.amt ? i.amt / A.T.amt * 100 : 0)}</span></div></td><td class="r">${i.nDays}</td></tr>`).join('')}</tbody>
      <tfoot><tr><td colspan="5">รวมรายจ่ายทั้งสิ้น (${rows.length} รายการ)</td><td class="r">${fmtQty(A.T.b)}</td><td class="r">${fmtQty(A.T.j)}</td><td class="r">${fmtMoney(A.T.amt)}</td><td>100%</td><td class="r">${A.activeDays}</td></tr></tfoot></table></div>`;
  },
  renderMonthTable() {
    const A = this.A;
    $('#monthTable').innerHTML = `<div class="table-wrap"><table class="tbl"><thead><tr><th>เดือน</th><th>ปีงบประมาณ</th><th>หน่วยงาน</th><th>สถานะ</th><th class="r">ยอดเบิก (บ)</th><th class="r">ยอดจ่าย (จ)</th><th class="r">อัตราจ่าย</th><th class="r">รวมเงิน (บาท)</th><th class="r">เทียบเดือนก่อน</th></tr></thead><tbody>
      ${A.months.map((m, k) => { const p = A.months[k - 1]; const d = p && p.amt > 0 ? (m.amt - p.amt) / p.amt * 100 : null; return `<tr class="clickable" data-month="${m.ym}"><td><b>${esc(periodLabel(m.m, m.y))}</b></td><td>${fiscalYear(m.y, m.m)}</td><td>${esc([...new Set(m.recs.map(r => r.department))].join(', '))}</td><td>${m.recs.map(r => statusBadge(r.record_status)).join(' ')}</td><td class="r">${fmtQty(m.b)}</td><td class="r">${fmtQty(m.j)}</td><td class="r">${m.b ? fmtPct(m.j / m.b * 100) : '–'}</td><td class="r"><b>${fmtMoney(m.amt)}</b></td><td class="r">${d == null ? '<span class="muted">–</span>' : `<span class="${d > 0 ? 'delta-up' : 'delta-down'}">${d > 0 ? '▲' : '▼'} ${fmtPct(Math.abs(d))}</span>`}</td></tr>`; }).join('')}
      </tbody></table></div>`;
  },
  /* ---------- Drill-down ---------- */
  rowsFor(pred) {
    const A = this.A, out = new Map(), f = this.f, q = normName(f.q);
    A.recs.forEach(r => {
      const y = Number(r.report_year), m = Number(r.report_month), dim = daysInMonth(y, m);
      r.items.forEach(it => {
        if ((f.unit !== 'all' && String(it.unit || '').trim() !== f.unit) || (q && !normName(it.drug_name).includes(q))) return;
        DAY_KEYS.forEach(k => {
          if (k.d > dim) return;
          const dk = dateKey(y, m, k.d); if ((f.from && dk < f.from) || (f.to && dk > f.to)) return;
          const b = num(it[k.b]), j = num(it[k.j]); if ((!b && !j) || !pred(dk, ymKey(y, m), it)) return;
          const key = normName(it.drug_name);
          if (!out.has(key)) out.set(key, { key, name: it.drug_name, unit: it.unit, price: it.unit_price, b: 0, j: 0, amt: 0 });
          const o = out.get(key); o.b += b; o.j += j; o.amt += isBlank(it.unit_price) ? 0 : num(it.unit_price) * j;
        });
      });
    });
    return [...out.values()].sort((a, b) => b.amt - a.amt || b.j - a.j);
  },
  itemTable(rows) {
    if (!rows.length) return '<div class="empty">ไม่มีข้อมูล</div>';
    return `<div class="table-wrap" style="max-height:55vh"><table class="tbl"><thead><tr><th>ประเภทเวชภัณฑ์ยา</th><th>หน่วย</th><th class="r">ราคา/หน่วย</th><th class="r">บ (เบิก)</th><th class="r">จ (จ่าย)</th><th class="r">มูลค่า (บาท)</th></tr></thead>
      <tbody>${rows.map(r => `<tr><td class="name-cell">${esc(r.name)}</td><td>${esc(r.unit || '–')}</td><td class="r">${isBlank(r.price) ? '<span class="badge crit">ไม่มีราคา</span>' : fmtMoney(r.price)}</td><td class="r">${fmtQty(r.b)}</td><td class="r">${fmtQty(r.j)}</td><td class="r">${fmtMoney(r.amt)}</td></tr>`).join('')}</tbody>
      <tfoot><tr><td colspan="3">รวม ${rows.length} รายการ</td><td class="r">${fmtQty(sum(rows, r => r.b))}</td><td class="r">${fmtQty(sum(rows, r => r.j))}</td><td class="r">${fmtMoney(round2(sum(rows, r => r.amt)))}</td></tr></tfoot></table></div>`;
  },
  drillDate(dk) { this.modal(`รายละเอียดวันที่ ${dateKeyLabel(dk)}`, this.itemTable(this.rowsFor(d => d === dk))); },
  drillMonth(ym) { const mo = this.A.months.find(m => m.ym === ym); this.modal(`รายละเอียดเดือน${mo ? periodLabel(mo.m, mo.y) : ym}`, this.itemTable(this.rowsFor((d, y) => y === ym))); },
  drillItem(key) {
    const A = this.A, it = A.items.find(i => i.key === key); if (!it) return;
    const series = A.daily.map(d => ({ label: d.label, tip: d.tip, b: 0, j: 0 }));
    const idx = new Map(A.daily.map((d, i) => [d.dk, i]));
    A.recs.forEach(r => { const y = Number(r.report_year), m = Number(r.report_month); r.items.forEach(x => { if (normName(x.drug_name) !== key) return; DAY_KEYS.forEach(k => { const i = idx.get(dateKey(y, m, k.d)); if (i != null) { series[i].b += num(x[k.b]); series[i].j += num(x[k.j]); } }); }); });
    const m = this.modal(it.name, `<div class="kv" style="margin-bottom:14px"><div><small>หน่วย</small><b>${esc(it.unit || '–')}</b></div><div><small>ราคา/หน่วย (ล่าสุด)</small><b>${isBlank(it.price) ? 'ไม่มีราคา' : fmtMoney(it.price)}</b></div><div><small>Stock (ล่าสุด)</small><b>${isBlank(it.stock) ? '–' : fmtQty(it.stock)}</b></div><div><small>ยอดรวม บ / จ</small><b>${fmtQty(it.b)} / ${fmtQty(it.j)}</b></div><div><small>รวมเงิน</small><b>${fmtMoney(it.amt)} บาท</b></div><div><small>จำนวนวันที่ใช้</small><b>${it.nDays} วัน</b></div></div>
      <div class="legend" style="margin-bottom:6px"><span><i class="pill-b"></i>บ (เบิก)</span><span><i class="pill-j"></i>จ (จ่าย)</span></div><div class="viz" id="drillViz"></div>
      <div style="margin-top:12px">${this.miniTable(series.map((s, i) => ({ ...s, kind: 'date', key: A.daily[i].dk })).filter(s => s.b || s.j), [['tip', 'วันที่'], ['b', 'บ (เบิก)', fmtQty], ['j', 'จ (จ่าย)', fmtQty]])}</div>`, 'lg');
    setTimeout(() => Viz.mount(m.body.querySelector('#drillViz'), 'line', { height: 230, labels: series.map(s => s.label), tipLabels: series.map(s => s.tip), series: [{ name: 'บ เบิก', key: 'b', color: seriesColor('b'), values: series.map(s => s.b) }, { name: 'จ จ่าย', key: 'j', color: seriesColor('j'), values: series.map(s => s.j) }], aria: 'กราฟรายวันของ ' + it.name }), 30);
  },
  drillKPI(kind) {
    const A = this.A;
    if (kind === 'amt') return this.modal('รวมรายจ่ายแยกตามรายการ', this.itemTable(this.rowsFor(() => true)));
    if (kind === 'rate') return this.drillAlert('short');
    const rows = A.daily.filter(d => d.b || d.j).map(d => ({ ...d, kind: 'date', key: d.dk }));
    this.modal(kind === 'b' ? 'ยอดเบิก (บ) รายวัน' : 'ยอดจ่าย (จ) รายวัน', this.miniTable(rows, [['tip', 'วันที่'], ['b', 'บ (เบิก)', fmtQty], ['j', 'จ (จ่าย)', fmtQty], ['amt', 'มูลค่าจ่าย (บาท)', fmtMoney], ['n', 'จำนวนรายการ', fmtQty]]));
  },
  drillAlert(k) {
    const A = this.A;
    const evTable = list => list.length ? `<div class="table-wrap" style="max-height:55vh"><table class="tbl"><thead><tr><th>วันที่</th><th>รายการ</th><th class="r">บ (เบิก)</th><th class="r">จ (จ่าย)</th><th class="r">ส่วนต่าง</th></tr></thead><tbody>${list.map(s => `<tr><td>${esc(dateKeyLabel(s.dk))}</td><td class="name-cell">${esc(s.name)}</td><td class="r">${fmtQty(s.b)}</td><td class="r">${fmtQty(s.j)}</td><td class="r">${fmtQty(s.j - s.b)}</td></tr>`).join('')}</tbody></table></div>` : '<div class="empty">ไม่มีรายการ</div>';
    const simple = list => list.length ? `<div class="table-wrap"><table class="tbl"><thead><tr><th>ลำดับ</th><th>รายการ</th><th>หน่วย</th><th class="r">จ (จ่าย)</th></tr></thead><tbody>${list.map(i => `<tr><td>${i.item_no}</td><td class="name-cell">${esc(i.name)}</td><td>${esc(i.unit || '–')}</td><td class="r">${fmtQty(i.j)}</td></tr>`).join('')}</tbody></table></div>` : '<div class="empty">ไม่มีรายการ</div>';
    if (k === 'short') return this.modal('รายการที่จ่ายน้อยกว่าเบิก', evTable(A.shortfalls));
    if (k === 'over') return this.modal('รายการที่จ่ายมากกว่าเบิก', evTable(A.overs));
    if (k === 'noprice') return this.modal('รายการที่มีการจ่ายแต่ไม่มีราคา/หน่วย', `<p class="help" style="margin-bottom:10px">ผู้ดูแลสามารถเพิ่มราคาได้ที่ ผู้ดูแลระบบ › ตั้งค่า › รายการยาหลัก หรือแก้ไขในใบเบิก</p>` + simple(A.noPrice));
    if (k === 'unused') return this.modal('รายการที่ไม่มีการเบิกจ่ายในช่วงที่เลือก', simple(A.unused));
    if (k === 'top') return this.drillItem([...A.items].sort((a, b) => b.amt - a.amt)[0].key);
  },
  modal(title, body, size = 'lg') {
    const m = UI.modal({ title, body, size, actions: [{ label: 'พิมพ์', kind: 'btn-ghost', icon: 'print', close: false, onClick: () => printModal() }, { label: 'ปิด', kind: 'btn-primary' }] });
    m.body.addEventListener('click', e => { const r = e.target.closest('[data-date],[data-month]'); if (r) r.dataset.date ? this.drillDate(r.dataset.date) : this.drillMonth(r.dataset.month); });
    return m;
  },
};
function printModal() { document.body.classList.add('print-modal'); window.print(); setTimeout(() => document.body.classList.remove('print-modal'), 400); }

/* =======================================================================
 * 13) EXPORT — Excel / CSV / JSON / แบบฟอร์มต้นฉบับ
 * ======================================================================= */
const Exporter = {
  stamp() { const d = new Date(); return `${d.getFullYear()}${pad2(d.getMonth() + 1)}${pad2(d.getDate())}_${pad2(d.getHours())}${pad2(d.getMinutes())}`; },
  /** ป้องกัน Formula Injection เมื่อเปิดไฟล์ใน Excel/Sheets */
  safe(v) { return (typeof v === 'string' && /^[=+\-@\t\r]/.test(v)) ? "'" + v : v; },
  flat(records) {
    const requisitions = records.map(r => { const o = {}; REQ_COLUMNS.forEach(c => { o[c] = r[c] ?? ''; }); return o; });
    const requisition_items = records.flatMap(r => r.items.map(i => { const o = {}; ITEM_COLUMNS.forEach(c => { o[c] = i[c] ?? ''; }); return o; }));
    return { requisitions, requisition_items };
  },
  download(blob, name) {
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  },
  needXLSX() { if (window.XLSX) return true; UI.toast('โหลดไลบรารี Excel (SheetJS) ไม่สำเร็จ — ต้องเชื่อมต่ออินเทอร์เน็ต หรือใช้ CSV/JSON แทน', 'error', 7000); return false; },
  csv(rows, cols, name) {
    const cell = v => { v = this.safe(v ?? ''); const s = String(v); return /[",\n\r]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
    const text = '﻿' + [cols.join(','), ...rows.map(r => cols.map(c => cell(r[c])).join(','))].join('\r\n');
    this.download(new Blob([text], { type: 'text/csv;charset=utf-8' }), name);
  },
  json(obj, name) { this.download(new Blob([JSON.stringify(obj, null, 2)], { type: 'application/json' }), name); },
  sheet(rows, cols) { return XLSX.utils.json_to_sheet(rows.map(r => { const o = {}; cols.forEach(c => { o[c] = this.safe(r[c] ?? ''); }); return o; }), { header: cols }); },
  /** Excel โครงสร้างฐานข้อมูล (ชื่อชีต/คอลัมน์เดียวกับ Google Sheets) */
  excelDB(records, master, logs) {
    if (!this.needXLSX()) return;
    const f = this.flat(records), wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, this.sheet(f.requisitions, REQ_COLUMNS), 'requisitions');
    XLSX.utils.book_append_sheet(wb, this.sheet(f.requisition_items, ITEM_COLUMNS), 'requisition_items');
    XLSX.utils.book_append_sheet(wb, this.sheet(master, MASTER_COLUMNS), 'drug_master');
    if (logs) XLSX.utils.book_append_sheet(wb, this.sheet(logs, LOG_COLUMNS), 'audit_log');
    XLSX.writeFile(wb, `medreq_database_${this.stamp()}.xlsx`);
  },
  /** แบบฟอร์มต้นฉบับ: 1 ชีตต่อ 1 ใบเบิก (วันที่ 1–31 × บ/จ, ยอดรวม, รวมเงิน) */
  formAOA(r) {
    const C = 5 + 31 * 2 + 3;  // A..BR = 70 คอลัมน์ ตามต้นฉบับ
    const row = () => Array(C).fill('');
    const r2 = row(); r2[0] = r.hospital_name;
    const r3 = row(); r3[0] = r.form_title;
    const r4 = row(); r4[0] = `${r.department} เดือน ${MONTHS_TH[r.report_month - 1]} ${r.report_year}`;
    const r5 = row(), r6 = row(), r7 = row();
    Object.assign(r6, { 1: 'ประเภทเวชภัณฑ์ยา', 2: 'Stock', 3: 'ราคา/หน่วย', 4: 'หน่วย' });
    DAY_KEYS.forEach((k, i) => { const c = 5 + i * 2; r4[c] = 'วันที่'; r5[c] = k.d; r6[c] = 'จำนวน'; r7[c] = 'บ'; r7[c + 1] = 'จ'; });
    r4[67] = 'ยอดรวม'; r4[69] = 'รวมเงิน'; r6[67] = 'จำนวน'; r7[67] = 'บ'; r7[68] = 'จ'; r7[69] = '(บาท)';
    const body = r.items.map(it => { const x = row(); x[0] = it.item_no; x[1] = it.drug_name; x[2] = it.stock; x[3] = it.unit_price; x[4] = it.unit; DAY_KEYS.forEach((k, i) => { x[5 + i * 2] = it[k.b]; x[6 + i * 2] = it[k.j]; }); x[67] = it.total_b; x[68] = it.total_j; x[69] = it.total_amount; return x; });
    const tot = row(); tot[62] = 'รวมรายจ่ายทั้งสิ้น (บาท)'; tot[69] = r.grand_total_amount;
    return [row(), r2, r3, r4, r5, r6, r7, ...body, tot];
  },
  excelForms(records) {
    if (!this.needXLSX()) return;
    if (!records.length) return UI.toast('ไม่มีใบเบิกให้ส่งออก', 'warn');
    const wb = XLSX.utils.book_new(), used = new Set();
    records.forEach(r => {
      const ws = XLSX.utils.aoa_to_sheet(this.formAOA(r));
      const m = [{ s: { r: 1, c: 0 }, e: { r: 1, c: 6 } }, { s: { r: 2, c: 0 }, e: { r: 2, c: 6 } }, { s: { r: 3, c: 0 }, e: { r: 3, c: 2 } }, { s: { r: 3, c: 67 }, e: { r: 4, c: 68 } }, { s: { r: 3, c: 69 }, e: { r: 5, c: 69 } }];
      for (let i = 0; i < 31; i++) { const c = 5 + i * 2; m.push({ s: { r: 3, c }, e: { r: 3, c: c + 1 } }, { s: { r: 4, c }, e: { r: 4, c: c + 1 } }, { s: { r: 5, c }, e: { r: 5, c: c + 1 } }); }
      ws['!merges'] = m;
      ws['!cols'] = [{ wch: 5 }, { wch: 38 }, { wch: 7 }, { wch: 9 }, { wch: 7 }, ...Array(62).fill({ wch: 3.6 }), { wch: 6 }, { wch: 6 }, { wch: 12 }];
      let name = sheetName(r.report_month, r.report_year); if (used.has(name)) name = (name + ' ' + r.department).slice(0, 31); used.add(name);
      XLSX.utils.book_append_sheet(wb, ws, name.slice(0, 31));
    });
    XLSX.writeFile(wb, `รายงานสรุปการเบิกจ่ายยา_${this.stamp()}.xlsx`);
  },
};

/* =======================================================================
 * 14) IMPORT — JSON (สำรอง/sample_data.json), Excel แม่แบบฐานข้อมูล, Excel แบบฟอร์มต้นฉบับ
 * ======================================================================= */
const Importer = {
  async readFile(file) {
    if (/\.json$/i.test(file.name)) return this.fromJSON(JSON.parse(await file.text()));
    if (!Exporter.needXLSX()) throw new AppError('NO_XLSX', 'ต้องโหลด SheetJS ก่อนนำเข้า Excel');
    const wb = XLSX.read(await file.arrayBuffer(), { type: 'array' });
    if (wb.SheetNames.includes('requisitions') && wb.SheetNames.includes('requisition_items')) {
      const rows = n => XLSX.utils.sheet_to_json(wb.Sheets[n], { defval: '', raw: true });
      return this.fromJSON({ requisitions: rows('requisitions'), requisition_items: rows('requisition_items') });
    }
    return this.fromOriginal(wb);
  },
  fromJSON(o) {
    const items = o.requisition_items || [];
    const recs = (o.requisitions || o.records || []).map(r => ({ ...r, items: r.items || items.filter(i => i.record_id === r.record_id) }));
    return recs.map(r => ({ header: r, items: r.items, source: 'JSON/แม่แบบ' }));
  },
  /** อ่านไฟล์ต้นฉบับ: หา "เดือน ... ปี" ในหัว, แถว "ประเภทเวชภัณฑ์ยา", แถววันที่ 1–31 และแถว บ/จ (รองรับทั้งแบบมี/ไม่มีคอลัมน์ราคา) */
  fromOriginal(wb) {
    const out = [];
    const monthIdx = s => { const n = String(s).replace('ฏ', 'ฎ'); return MONTHS_TH.findIndex(m => m === n) + 1; };
    wb.SheetNames.forEach(sn => {
      const a = XLSX.utils.sheet_to_json(wb.Sheets[sn], { header: 1, raw: true, defval: '' });
      const txt = (r, c) => String(a[r]?.[c] ?? '').trim();
      let title = null, hdr = -1, hospital = '', form = '';
      for (let r = 0; r < Math.min(15, a.length); r++) {
        (a[r] || []).forEach((v, c) => {
          const s = String(v).trim();
          const mm = s.match(/^(.*?)\s*เดือน\s*(\S+)\s+(\d{4})/);
          if (mm && !title) title = { dept: mm[1].trim(), month: monthIdx(mm[2]), year: Number(mm[3]) };
          if (s === 'ประเภทเวชภัณฑ์ยา' && hdr < 0) hdr = r;
          if (!hospital && /^โรงพยาบาล/.test(s)) hospital = s;
          if (!form && /^ใบเบิก/.test(s)) form = s;
        });
      }
      if (!title || !title.month || hdr < 0) return;
      const H = a[hdr], col = name => H.findIndex(v => String(v).trim() === name);
      const nameCol = col('ประเภทเวชภัณฑ์ยา'), stockCol = col('Stock'), priceCol = col('ราคา/หน่วย'), unitCol = col('หน่วย');
      let dayRow = -1;
      for (let r = hdr - 3; r <= hdr; r++) if (r >= 0 && (a[r] || []).filter(v => Number(v) >= 1 && Number(v) <= 31 && Number.isInteger(Number(v)) && v !== '').length >= 28) dayRow = r;
      const subRow = hdr + 1, totCol = (a[hdr - 2] || []).findIndex(v => String(v).trim() === 'ยอดรวม');
      if (dayRow < 0) return;
      const map = {}; let cur = 0;
      (a[subRow] || []).forEach((_, c) => {
        if (totCol > 0 && c >= totCol) return;
        const dv = a[dayRow][c]; if (dv !== '' && Number(dv) >= 1 && Number(dv) <= 31) cur = Number(dv);
        const lab = txt(subRow, c);
        if (cur && (lab === 'บ' || lab === 'จ')) map[c] = DAY_KEYS[cur - 1][lab === 'บ' ? 'b' : 'j'];
      });
      const items = [];
      for (let r = subRow + 1; r < a.length; r++) {
        const name = txt(r, nameCol); if (!name) continue;
        const it = { item_no: Number(a[r][0]) || items.length + 1, drug_name: name, unit: unitCol >= 0 ? txt(r, unitCol) : '', stock: stockCol >= 0 ? a[r][stockCol] : '', unit_price: priceCol >= 0 ? a[r][priceCol] : '' };
        if (priceCol < 0) { const md = Data.master.find(d => normName(d.drug_name) === normName(name)); it.unit_price = md ? md.unit_price : ''; it._priceFromMaster = true; }
        Object.entries(map).forEach(([c, f]) => { const v = a[r][c]; it[f] = v === '' || v == null ? '' : v; });
        items.push(it);
      }
      const hasQty = items.some(i => ITEM_DAY_COLUMNS.some(f => num(i[f]) > 0));
      out.push({ header: { hospital_name: hospital || CONFIG.ORG_NAME, form_title: form || CONFIG.FORM_TITLE, department: title.dept || CONFIG.DEPARTMENT, report_month: title.month, report_year: title.year }, items, source: `ชีต ${sn}${priceCol < 0 ? ' (ใช้ราคาจากรายการยาหลัก)' : ''}`, empty: !hasQty });
    });
    return out;
  },
};

  /** หน้าต่างเพิ่ม/แก้ไขใบเบิก (ผู้ดูแล) — ยืนยันก่อนบันทึก และบันทึกประวัติการแก้ไข */
  openEditor(rec) {
    const isNew = !rec, t = todayBE();
    const v = isNew ? { report_month: t.m, report_year: t.y, department: CONFIG.DEPARTMENT, hospital_name: CONFIG.ORG_NAME, form_title: CONFIG.FORM_TITLE, record_status: 'submitted' }
      : { report_month: rec.report_month, report_year: rec.report_year, department: rec.department, hospital_name: rec.hospital_name, form_title: rec.form_title, record_status: rec.record_status };
    let work = isNew ? Editor.newRecord(v) : Editor.withMasterItems(clone(rec));
    let base = isNew ? null : clone(work);
    const fields = HEADER_FIELDS.filter(f => !f.ui && f.key !== 'recorder').map(f => ({ ...f, cols: f.key === 'report_month' ? 12 : 4 }))
      .concat([{ key: 'record_status', label: 'สถานะ', type: 'choice', required: true, cols: 12, options: Object.entries(STATUS).map(([k, s]) => ({ value: k, label: s.label })) }]);
    const wrap = document.createElement('div');
    const draw = () => {
      wrap.innerHTML = `<div class="form-grid" style="margin-bottom:16px">${FormKit.html(fields, v)}</div><div class="legend" style="margin-bottom:8px"><span><i class="pill-b"></i>บ = เบิก</span><span><i class="pill-j"></i>จ = จ่าย</span><span>แก้ชื่อรายการได้ในตาราง · ยอดรวมคำนวณอัตโนมัติ</span></div><div id="edGrid"></div>`;
      const g = wrap.querySelector('#edGrid'); g.innerHTML = Editor.gridHTML(work, { editable: true, editName: true });
      Editor.bindCells(g, work);
    };
    draw();
    FormKit.bind(wrap, fields, v, key => {
      if (['report_month', 'report_year'].includes(key) && Number(v.report_month) >= 1 && Number(v.report_year) >= 2500) {
        Object.assign(work, { report_month: Number(v.report_month), report_year: Number(v.report_year) });
        const g = wrap.querySelector('#edGrid'); g.innerHTML = Editor.gridHTML(work, { editable: true, editName: true });
      }
    });
    UI.modal({
      title: isNew ? 'เพิ่มใบเบิกใหม่' : `แก้ไขใบเบิก ${rec.record_id}`, size: 'xl', body: wrap, dismissible: false,
      actions: [
        { label: 'ยกเลิก', kind: 'btn-ghost' },
        { label: isNew ? 'บันทึกใบเบิก' : 'บันทึกการแก้ไข', kind: 'btn-primary', icon: 'save', onClick: async (btn) => {
          ['hospital_name', 'form_title', 'department', 'record_status'].forEach(k => { work[k] = k === 'record_status' ? v[k] : sanitizeText(v[k], 160); });
          work.report_month = Number(v.report_month); work.report_year = Number(v.report_year);
          const fe = FormKit.validate(fields, v);
          if (Object.keys(fe).length) { FormKit.showErrors(wrap, fe); UI.toast('กรุณากรอกข้อมูลให้ครบถ้วน', 'warn'); return false; }
          const errs = Engine.validate(work, work.items);
          if (errs.length) { UI.modal({ title: 'ข้อมูลไม่ผ่านการตรวจสอบ', body: UI.errorHTML(new AppError('VALIDATION', `พบข้อผิดพลาด ${errs.length} จุด`, errs)), actions: [{ label: 'ตกลง', kind: 'btn-primary' }] }); return false; }
          const patch = isNew ? null : Editor.diff(base, work, true);
          if (patch && !patch.count) { UI.toast('ไม่มีการเปลี่ยนแปลง', 'info'); return false; }
          const ok = await UI.confirm({ title: isNew ? 'ยืนยันการเพิ่มใบเบิก' : 'ยืนยันการแก้ไขข้อมูล', html: isNew ? `<p>เพิ่มใบเบิก <b>${esc(periodLabel(work.report_month, work.report_year))}</b> · ${esc(work.department)} รวม ${fmtMoney(work.grand_total_amount)} บาท</p>` : `<p>บันทึกการแก้ไข <b>${patch.count}</b> ช่อง ในใบเบิก <span class="code">${esc(work.record_id)}</span></p><p class="help">ระบบจะบันทึกวัน เวลา ผู้แก้ไข และรายการที่เปลี่ยนในประวัติการแก้ไข</p>`, confirmText: 'ยืนยันบันทึก' });
          if (!ok) return false;
          btn.disabled = true; UI.busy(true, 'กำลังบันทึก...');
          try {
            if (isNew) await Store.create({ ...Editor.payloadHeader(work), record_status: v.record_status }, Editor.payloadItems(work), Auth.user);
            else await Store.update(work.record_id, patch, Auth.user);
            await Data.refresh(); UI.toast('บันทึกสำเร็จ', 'good'); this.render();
          } catch (e) { UI.modal({ title: 'บันทึกไม่สำเร็จ', body: UI.errorHTML(e), actions: [{ label: 'ตกลง', kind: 'btn-primary' }] }); btn.disabled = false; return false; }
          finally { UI.busy(false); }
        } },
      ],
    });
  },
  async toggleLock(r) {
    const to = r.record_status === 'locked' ? 'submitted' : 'locked';
    if (!(await UI.confirm({ title: to === 'locked' ? 'ปิดงวดใบเบิก?' : 'เปิดงวดใบเบิก?', message: to === 'locked' ? `เมื่อปิดงวด ${periodLabel(r.report_month, r.report_year)} ผู้บันทึกทั่วไปจะแก้ไขไม่ได้` : `อนุญาตให้ผู้บันทึกแก้ไข ${periodLabel(r.report_month, r.report_year)} ได้อีกครั้ง`, confirmText: to === 'locked' ? 'ปิดงวด' : 'เปิดงวด' }))) return;
    UI.busy(true);
    try { await Store.update(r.record_id, { header: { record_status: to }, items: [] }, Auth.user); await Data.refresh(); UI.toast('อัปเดตสถานะแล้ว', 'good'); this.renderRecordTable(); }
    catch (e) { UI.toast(e.message, 'error', 7000); } finally { UI.busy(false); }

  async importFile(file) {
    let list;
    try { list = await Importer.readFile(file); } catch (e) { return UI.modal({ title: 'อ่านไฟล์ไม่สำเร็จ', body: UI.errorHTML(e), actions: [{ label: 'ตกลง', kind: 'btn-primary' }] }); }
    if (!list.length) return UI.toast('ไม่พบข้อมูลใบเบิกในไฟล์', 'warn');
    const plan = list.map(x => {
      const h = x.header, ex = Data.records.find(r => r.record_id === h.record_id) || Data.findPeriod(h.department, h.report_year, h.report_month);
      const tot = sum(x.items, i => { let tj = 0; DAY_KEYS.forEach(k => { tj += num(i[k.j]); }); return isBlank(i.unit_price) ? 0 : num(i.unit_price) * tj; });
      return { ...x, existing: ex, tot: round2(tot), include: !x.empty };
    });
    const html = `<p style="margin-bottom:10px">พบ <b>${plan.length}</b> ใบเบิกในไฟล์ <span class="code">${esc(file.name)}</span></p>
      <div class="table-wrap" style="max-height:50vh"><table class="tbl"><thead><tr><th class="c">นำเข้า</th><th>เดือน</th><th>หน่วยงาน</th><th>แหล่งข้อมูล</th><th class="r">รายการ</th><th class="r">รวมเงิน (บาท)</th><th>การดำเนินการ</th></tr></thead><tbody>
      ${plan.map((p, i) => `<tr><td class="c"><input type="checkbox" data-i="${i}" ${p.include ? 'checked' : ''} aria-label="นำเข้า"></td><td><b>${esc(periodLabel(p.header.report_month, p.header.report_year))}</b></td><td>${esc(p.header.department)}</td><td style="font-size:12.5px">${esc(p.source)}${p.empty ? ' <span class="badge muted">ไม่มีจำนวน</span>' : ''}</td><td class="r">${p.items.length}</td><td class="r">${fmtMoney(p.tot)}</td><td>${p.existing ? `<span class="badge warn">รวมกับ ${esc(p.existing.record_id)}</span>` : '<span class="badge good">สร้างใหม่</span>'}</td></tr>`).join('')}
      </tbody></table></div>`;
    UI.modal({ title: 'ตรวจสอบก่อนนำเข้า', size: 'lg', body: html, actions: [{ label: 'ยกเลิก', kind: 'btn-ghost' }, { label: 'นำเข้าที่เลือก', kind: 'btn-primary', icon: 'upload', onClick: async (btn, close) => {
      $$('.modal input[data-i]').forEach(c => { plan[c.dataset.i].include = c.checked; });
      const sel = plan.filter(p => p.include); if (!sel.length) { UI.toast('ยังไม่ได้เลือกรายการ', 'warn'); return false; }
      btn.disabled = true; close();
      let ok = 0; const fails = [];
      for (const [n, p] of sel.entries()) {
        UI.busy(true, `กำลังนำเข้า ${n + 1}/${sel.length} ...`);
        try {
          const rid = p.existing?.record_id || p.header.record_id || genRecordId(p.header.report_year, p.header.report_month);
          const work = { ...p.header, record_id: rid, items: p.items.map(i => ({ ...i })) };
          if (p.existing) await Store.update(rid, Editor.diff(p.existing, work), Auth.user);
          else await Store.create({ ...Editor.payloadHeader(work), record_status: p.header.record_status || 'submitted' }, Editor.payloadItems(work), Auth.user);
          ok++;
        } catch (e) { fails.push(`${periodLabel(p.header.report_month, p.header.report_year)}: ${e.message}${Array.isArray(e.details) ? ' (' + e.details.slice(0, 3).map(d => d.message).join('; ') + ')' : ''}`); }
      }
      UI.busy(false); await Data.refresh().catch(() => {});
      if (fails.length) UI.modal({ title: `นำเข้าสำเร็จ ${ok} / ${sel.length}`, body: `<ul>${fails.map(f => `<li>${esc(f)}</li>`).join('')}</ul>`, actions: [{ label: 'ตกลง', kind: 'btn-primary' }] });
      else UI.toast(`นำเข้าสำเร็จ ${ok} ใบเบิก`, 'good');
      this.tab = 'records'; this.render();
    } }] });
  },

      LocalStore.resetDemo(); await Data.refresh(); UI.toast('รีเซ็ตข้อมูลตัวอย่างแล้ว', 'good'); this.render();
    });
  },
};

/* =======================================================================
 * 16) ROUTER + INIT
 * ======================================================================= */
const Router = {
  pages: { entry: EntryPage, dashboard: DashboardPage, admin: AdminPage },
  async go() {
    const name = (location.hash.match(/^#\/(\w+)/) || [])[1];
    const key = Router.pages[name] ? name : 'entry';   // หน้าแรก = หน้าบันทึกข้อมูล
    Object.keys(Router.pages).forEach(k => { $('#page-' + k).hidden = k !== key; });
    $$('[data-route]').forEach(a => a.classList.toggle('active', a.dataset.route === key));
    const page = Router.pages[key];
    $('#pageTitle').textContent = page.title;
    $('#pageSub').textContent = typeof page.sub === 'function' ? page.sub() : page.sub;
    $('#topDashLink').hidden = key === 'dashboard';
    document.title = `${page.title} · ${CONFIG.APP_NAME}`;
    Viz.hideTip();
    try { await page.show(); } catch (e) { console.error(e); UI.toast(e.message, 'error', 7000); }
    $('#pageSub').textContent = typeof page.sub === 'function' ? page.sub() : page.sub;
  },
};

function applyBranding() {
  const root = document.documentElement.style;
  if (CONFIG.THEME.primary) root.setProperty('--brand-1', CONFIG.THEME.primary);
  if (CONFIG.THEME.secondary) root.setProperty('--brand-2', CONFIG.THEME.secondary);
  $('#brandName').innerHTML = `${esc(CONFIG.APP_NAME)} <b>${esc(CONFIG.APP_NAME_ACCENT)}</b>`;
  $('#brandOrg').textContent = CONFIG.ORG_NAME;
  const logo = $('#brandLogo');
  if (CONFIG.LOGO && !CONFIG.LOGO.startsWith('__')) logo.src = CONFIG.LOGO; else logo.hidden = true;
}
function setTheme(t) {
  document.documentElement.setAttribute('data-theme', t); LS.set('theme', t);
  $('#themeToggle').checked = t === 'dark';
  if (Router.pages.dashboard.A && !$('#page-dashboard').hidden) DashboardPage.renderBody();   // สีกราฟเปลี่ยนตามธีม
}

async function init() {
  applyBranding();
  $('#themeToggle').checked = document.documentElement.getAttribute('data-theme') === 'dark';
  $('#themeToggle').onchange = e => setTheme(e.target.checked ? 'dark' : 'light');
  $('#themeToggleMobile').onclick = () => setTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
  window.addEventListener('hashchange', Router.go);
  window.addEventListener('online', () => { UI.toast('กลับมาออนไลน์แล้ว', 'good'); Outbox.flush(); });
  window.addEventListener('offline', () => UI.toast('ออฟไลน์ — ข้อมูลที่บันทึกจะถูกเก็บไว้และส่งเมื่อออนไลน์', 'warn', 7000));
  window.addEventListener('beforeunload', e => { if (EntryPage.st && EntryPage.dirty()) { e.preventDefault(); e.returnValue = ''; } });
  window.addEventListener('scroll', () => Viz.hideTip(), { passive: true });
  try { await Store.init(); } catch (e) { console.error(e); }
  UI.updateChrome();
  Router.go();
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
</script>
