/* =======================================================================
 * 4) ENGINE — คำนวณ ตรวจสอบ และจัดการข้อมูลแบบตาราง (logic เดียวกับ Code.gs)
 * ======================================================================= */
const Engine = {
  blankItem(drug, recordId, now = '', user = '') {
    const it = {};
    ITEM_COLUMNS.forEach(c => { it[c] = ''; });
    Object.assign(it, {
      item_id: `${recordId}-${pad2(drug.item_no)}`, record_id: recordId, item_no: Number(drug.item_no),
      drug_name: drug.drug_name, unit: drug.unit ?? '', unit_price: drug.unit_price ?? '',
      total_b: 0, total_j: 0, total_amount: 0, created_at: now, updated_at: now, created_by: user, updated_by: user,
    });
    return it;
  },
  /** ยอดรวม บ = Σ บ ทุกวัน, ยอดรวม จ = Σ จ ทุกวัน, รวมเงิน = ราคา/หน่วย × ยอดรวม จ (ตามสูตรในไฟล์ต้นฉบับ) */
  recalcItem(it) {
    let tb = 0, tj = 0;
    DAY_KEYS.forEach(k => { tb += num(it[k.b]); tj += num(it[k.j]); });
    it.total_b = round2(tb); it.total_j = round2(tj);
    it.total_amount = isBlank(it.unit_price) ? 0 : round2(num(it.unit_price) * tj);
    return it;
  },
  /** รวมรายจ่ายทั้งสิ้น = SUM(รวมเงิน ทุกรายการ) */
  recalcRecord(rec, items) {
    items.forEach(i => this.recalcItem(i));
    rec.grand_total_amount = round2(sum(items, i => i.total_amount));
    return rec;
  },
  coerceNum(v) {
    if (isBlank(v)) return '';
    const s = String(v).replace(/,/g, '').trim();
    if (s === '') return '';
    const n = Number(s);
    return isNaN(n) ? s : n;   // ค่าที่ไม่ใช่ตัวเลขจะถูกจับโดย validate
  },
  coerceItemField(k, v) { return (k === 'drug_name' || k === 'unit') ? sanitizeText(v, 160) : this.coerceNum(v); },
  coerceHeaderField(k, v) {
    if (k === 'report_month' || k === 'report_year') return this.coerceNum(v);
    return sanitizeText(v, 160);
  },
  /** ตรวจสอบความถูกต้องของทั้งใบเบิก (ใช้ทั้งก่อนส่งและก่อนบันทึก) */
  validate(h, items) {
    const errs = [];
    const need = (k) => { if (isBlank(h[k]) || String(h[k]).trim() === '') errs.push({ field: k, message: `กรุณากรอก${FIELD_LABELS[k]}` }); };
    ['hospital_name', 'form_title', 'department', 'report_month', 'report_year'].forEach(need);
    const m = Number(h.report_month), y = Number(h.report_year);
    if (!isBlank(h.report_month) && (!Number.isInteger(m) || m < 1 || m > 12)) errs.push({ field: 'report_month', message: 'เดือนต้องเป็น 1–12' });
    if (!isBlank(h.report_year) && (!Number.isInteger(y) || y < 2500 || y > 2700)) errs.push({ field: 'report_year', message: 'ปี พ.ศ. ต้องเป็นจำนวนเต็ม 2500–2700' });
    if (!isBlank(h.record_status) && !STATUS[h.record_status]) errs.push({ field: 'record_status', message: 'สถานะไม่ถูกต้อง' });
    const dim = (m >= 1 && m <= 12 && y > 2400) ? daysInMonth(y, m) : 31;
    const seen = new Set();
    items.forEach(it => {
      const no = Number(it.item_no);
      const tag = `รายการที่ ${it.item_no}${it.drug_name ? ' (' + it.drug_name + ')' : ''}`;
      if (!Number.isInteger(no) || no < 1) errs.push({ item_no: it.item_no, field: 'item_no', message: `${tag}: ลำดับต้องเป็นจำนวนเต็มบวก` });
      if (seen.has(no)) errs.push({ item_no: no, field: 'item_no', message: `${tag}: ลำดับซ้ำ` });
      seen.add(no);
      if (isBlank(it.drug_name) || !String(it.drug_name).trim()) errs.push({ item_no: no, field: 'drug_name', message: `${tag}: ต้องระบุชื่อเวชภัณฑ์ยา` });
      const chkNum = (field, max, label) => {
        const v = it[field];
        if (isBlank(v)) return;
        const n = Number(v);
        if (typeof v === 'string' && isNaN(n)) errs.push({ item_no: no, field, message: `${tag}: ${label} ต้องเป็นตัวเลข` });
        else if (n < 0) errs.push({ item_no: no, field, message: `${tag}: ${label} ต้องไม่ติดลบ` });
        else if (n > max) errs.push({ item_no: no, field, message: `${tag}: ${label} เกินค่าสูงสุด ${fmtNum(max)}` });
        else if (decimals(n) > 2) errs.push({ item_no: no, field, message: `${tag}: ${label} ทศนิยมได้ไม่เกิน 2 ตำแหน่ง` });
      };
      chkNum('stock', CONFIG.MAX_STOCK, 'Stock');
      chkNum('unit_price', CONFIG.MAX_PRICE, 'ราคา/หน่วย');
      DAY_KEYS.forEach(k => {
        chkNum(k.b, CONFIG.MAX_QTY, `วันที่ ${k.d} บ`);
        chkNum(k.j, CONFIG.MAX_QTY, `วันที่ ${k.d} จ`);
        if (k.d > dim && (num(it[k.b]) > 0 || num(it[k.j]) > 0)) errs.push({ item_no: no, field: k.b, message: `${tag}: ไม่มีวันที่ ${k.d} ใน${MONTHS_TH[m - 1]}` });
      });
    });
    return errs;
  },
  /** คำเตือน (ไม่บังคับ) เช่น จ่ายมากกว่าเบิก หรือมีการใช้แต่ไม่มีราคา */
  warnings(h, items) {
    const w = [];
    const dim = daysInMonth(h.report_year, h.report_month) || 31;
    items.forEach(it => {
      DAY_KEYS.forEach(k => {
        if (k.d <= dim && num(it[k.j]) > num(it[k.b])) w.push({ kind: 'over', item_no: it.item_no, day: k.d, message: `${it.drug_name}: วันที่ ${k.d} จ่าย (${fmtQty(it[k.j])}) มากกว่าเบิก (${fmtQty(num(it[k.b]))})` });
      });
      if (num(it.total_j) > 0 && isBlank(it.unit_price)) w.push({ kind: 'noprice', item_no: it.item_no, message: `${it.drug_name}: มีการจ่ายแต่ไม่มีราคา/หน่วย จึงไม่ถูกนับใน "รวมเงิน"` });
    });
    return w;
  },
  pickHeader(src) { const h = {}; REQ_COLUMNS.forEach(c => { h[c] = src[c] ?? ''; }); return h; },
  join(db) {
    const byRec = new Map();
    db.requisition_items.forEach(i => { if (!byRec.has(i.record_id)) byRec.set(i.record_id, []); byRec.get(i.record_id).push(i); });
    return db.requisitions.map(r => ({ ...clone(r), items: clone((byRec.get(r.record_id) || []).sort((a, b) => a.item_no - b.item_no)) }))
      .sort((a, b) => ymKey(a.report_year, a.report_month).localeCompare(ymKey(b.report_year, b.report_month)) || String(a.department).localeCompare(String(b.department)));
  },
  log(db, ctx, action, recordId, details) {
    db.audit_log.push({ log_id: 'LOG-' + Date.now().toString(36).toUpperCase() + '-' + uid(4), timestamp: nowISO(), user: ctx.user || '-', action, record_id: recordId || '', details: String(details || '').slice(0, 4000) });
    if (db.audit_log.length > 3000) db.audit_log.splice(0, db.audit_log.length - 3000);
  },
  findPeriod(db, dept, y, m, exceptId) {
    return db.requisitions.find(r => r.record_id !== exceptId && normName(r.department) === normName(dept) && Number(r.report_year) === Number(y) && Number(r.report_month) === Number(m));
  },
  create(db, payload, ctx) {
    const src = payload.record || {};
    const h = {};
    HEADER_EDITABLE.forEach(k => { h[k] = this.coerceHeaderField(k, src[k]); });
    h.record_id = sanitizeText(src.record_id, 40) || genRecordId(h.report_year, h.report_month);
    const exists = db.requisitions.find(r => r.record_id === h.record_id);
    if (exists) return { record_id: h.record_id, idempotent: true, message: 'มีรายการนี้อยู่แล้ว (ป้องกันการบันทึกซ้ำ)' };
    const dup = this.findPeriod(db, h.department, h.report_year, h.report_month);
    if (dup) throw new AppError('DUPLICATE_PERIOD', `มีใบเบิกของ ${h.department} เดือน${periodLabel(h.report_month, h.report_year)} อยู่แล้ว`, null, { record_id: dup.record_id });
    h.record_status = (ctx.admin && STATUS[src.record_status]) ? src.record_status : 'submitted';
    const now = nowISO(), user = sanitizeText(ctx.user, 80) || '-';
    const items = (payload.items || []).map(p => {
      const it = this.blankItem({ item_no: p.item_no, drug_name: '', unit: '', unit_price: '' }, h.record_id, now, user);
      ITEM_EDITABLE.forEach(k => { if (k in p) it[k] = this.coerceItemField(k, p[k]); });
      return it;
    });
    const errs = this.validate(h, items);
    if (errs.length) throw new AppError('VALIDATION', 'ข้อมูลไม่ผ่านการตรวจสอบ', errs);
    Object.assign(h, { created_at: now, updated_at: now, created_by: user, updated_by: user });
    this.recalcRecord(h, items);
    db.requisitions.push(this.pickHeader(h));
    items.forEach(i => db.requisition_items.push(i));
    this.log(db, ctx, 'create', h.record_id, `สร้างใบเบิก ${h.department} ${periodLabel(h.report_month, h.report_year)} · ${items.length} รายการ · รวม ${fmtMoney(h.grand_total_amount)} บาท`);
    return { record_id: h.record_id };
  },
  update(db, payload, ctx) {
    const id = payload.record_id;
    const rec = db.requisitions.find(r => r.record_id === id);
    if (!rec) throw new AppError('NOT_FOUND', `ไม่พบใบเบิกรหัส ${id}`);
    if (rec.record_status === 'locked' && !ctx.admin) throw new AppError('FORBIDDEN', 'ใบเบิกนี้ปิดงวดแล้ว แก้ไขได้เฉพาะผู้ดูแลระบบ');
    const hp = payload.header || {};
    if ('record_status' in hp && !ctx.admin) throw new AppError('FORBIDDEN', 'เปลี่ยนสถานะได้เฉพาะผู้ดูแลระบบ');
    const merged = clone(rec), changes = [];
    HEADER_EDITABLE.forEach(k => {
      if (!(k in hp)) return;
      const v = this.coerceHeaderField(k, hp[k]);
      if (String(v) !== String(rec[k])) { changes.push(`${k}: ${rec[k]} → ${v}`); merged[k] = v; }
    });
    if ('record_status' in hp && hp.record_status !== rec.record_status) {
      if (!STATUS[hp.record_status]) throw new AppError('VALIDATION', 'สถานะไม่ถูกต้อง');
      changes.push(`record_status: ${rec.record_status} → ${hp.record_status}`); merged.record_status = hp.record_status;
    }
    const dup = this.findPeriod(db, merged.department, merged.report_year, merged.report_month, id);
    if (dup) throw new AppError('DUPLICATE_PERIOD', `มีใบเบิกของ ${merged.department} เดือน${periodLabel(merged.report_month, merged.report_year)} อยู่แล้ว`, null, { record_id: dup.record_id });
    const now = nowISO(), user = sanitizeText(ctx.user, 80) || '-';
    const items = clone(db.requisition_items.filter(i => i.record_id === id));
    const byNo = new Map(items.map(i => [Number(i.item_no), i]));
    (payload.items || []).forEach(p => {
      const no = Number(p.item_no);
      let t = byNo.get(no);
      if (!t) { t = this.blankItem({ item_no: no, drug_name: '', unit: '', unit_price: '' }, id, now, user); items.push(t); byNo.set(no, t); changes.push(`เพิ่มรายการ #${no}`); t._touched = true; }
      ITEM_EDITABLE.forEach(k => {
        if (!(k in p)) return;
        const v = this.coerceItemField(k, p[k]);
        if (String(v) !== String(t[k])) { changes.push(`#${no} ${k}: ${isBlank(t[k]) ? '∅' : t[k]} → ${isBlank(v) ? '∅' : v}`); t[k] = v; t._touched = true; }
      });
    });
    const errs = this.validate(merged, items);
    if (errs.length) throw new AppError('VALIDATION', 'ข้อมูลไม่ผ่านการตรวจสอบ', errs);
    if (!changes.length) return { record_id: id, unchanged: true, message: 'ไม่มีการเปลี่ยนแปลง' };
    items.forEach(i => { if (i._touched) { i.updated_at = now; i.updated_by = user; delete i._touched; } });
    this.recalcRecord(merged, items);
    Object.assign(merged, { updated_at: now, updated_by: user });
    Object.assign(rec, this.pickHeader(merged));
    db.requisition_items = db.requisition_items.filter(i => i.record_id !== id).concat(items.sort((a, b) => a.item_no - b.item_no));
    this.log(db, ctx, 'update', id, `แก้ไข ${changes.length} จุด: ` + changes.slice(0, 80).join('; ') + (changes.length > 80 ? ' …' : ''));
    return { record_id: id, changes: changes.length };
  },
  remove(db, payload, ctx) {
    if (!ctx.admin) throw new AppError('FORBIDDEN', 'ลบข้อมูลได้เฉพาะผู้ดูแลระบบ');
    const id = payload.record_id;
    const rec = db.requisitions.find(r => r.record_id === id);
    if (!rec) throw new AppError('NOT_FOUND', `ไม่พบใบเบิกรหัส ${id}`);
    const n = db.requisition_items.filter(i => i.record_id === id).length;
    db.requisitions = db.requisitions.filter(r => r.record_id !== id);
    db.requisition_items = db.requisition_items.filter(i => i.record_id !== id);
    this.log(db, ctx, 'delete', id, `ลบใบเบิก ${rec.department} ${periodLabel(rec.report_month, rec.report_year)} (${n} รายการ, รวม ${fmtMoney(rec.grand_total_amount)} บาท)`);
    return { record_id: id };
  },
};

/* =======================================================================
 * 5) DATA STORES — LocalStore (Demo Mode) / ApiStore (Google Apps Script)
 *    ทั้งสองมีเมธอดเหมือนกัน หน้าเว็บเรียกผ่าน Store เท่านั้น
 * ======================================================================= */
/** ข้อมูลตัวอย่างอยู่ท้ายไฟล์ (<script id="sample-data">) จึงอ่านเมื่อจำเป็นหลังโหลดหน้าเสร็จ */
const getSample = () => { try { return JSON.parse(document.getElementById('sample-data').textContent); } catch (e) { return null; } };
const stripPII = recs => recs.map(r => { PII_FIELDS.forEach(f => delete r[f]); (r.items || []).forEach(i => PII_FIELDS.forEach(f => delete i[f])); return r; });

const Auth = {
  get session() { const s = SS.get('session'); return s && s.exp > Date.now() ? s : null; },
  get token() { return this.session?.token || ''; },
  get user() { return this.session?.username || ''; },
  valid() { return !!this.session; },
  set(s) { SS.set('session', { ...s, exp: Date.now() + CONFIG.SESSION_HOURS * 3600e3 }); },
  clear() { SS.del('session'); },
};

const LocalStore = {
  kind: 'demo',
  load() {
    let db = LS.get('db');
    if (!db || !Array.isArray(db.requisitions)) db = this.seed();
    db.requisitions ||= []; db.requisition_items ||= []; db.drug_master ||= clone(DEFAULT_DRUGS); db.audit_log ||= [];
    return db;
  },
  seed() {
    const sample = getSample();
    const db = {
      requisitions: sample?.requisitions || [], requisition_items: sample?.requisition_items || [],
      drug_master: sample?.drug_master || clone(DEFAULT_DRUGS), audit_log: [],
    };
    Engine.log(db, { user: 'system' }, 'seed', '', 'เริ่ม Demo Mode ด้วยข้อมูลตัวอย่างจากไฟล์ต้นฉบับ (ชีต ตค.69)');
    this.save(db);
    return db;
  },
  save(db) { if (!LS.set('db', db)) throw new AppError('STORAGE', 'บันทึกลง Local Storage ไม่สำเร็จ (พื้นที่เต็มหรือถูกปิดใช้งาน)'); },
  ctx(user) { const admin = this.isAdmin(); return { admin, user: admin ? Auth.user : user }; },
  isAdmin() { const s = Auth.session; return !!(s && s.token && s.token === SS.get('local_token')); },
  async init() { this.load(); },
  async list() { const recs = Engine.join(this.load()); return this.isAdmin() ? recs : stripPII(recs); },
  async create(record, items, user) { const db = this.load(); const r = Engine.create(db, { record, items }, this.ctx(user)); this.save(db); return r; },
  async update(recordId, patch, user) { const db = this.load(); const r = Engine.update(db, { record_id: recordId, ...patch }, this.ctx(user)); this.save(db); return r; },
  async remove(recordId) { const db = this.load(); const r = Engine.remove(db, { record_id: recordId }, this.ctx()); this.save(db); return r; },
  creds() { return LS.get('admin_cred') || { username: CONFIG.DEFAULT_ADMIN.username, hash: CONFIG.DEFAULT_ADMIN.password_hash, is_default: true }; },
  async login(username, password) {
    const c = this.creds();
    const db = this.load();
    if (username !== c.username || hashPassword(password) !== c.hash) {
      Engine.log(db, { user: username || '-' }, 'login_failed', '', 'เข้าสู่ระบบไม่สำเร็จ'); this.save(db);
      throw new AppError('AUTH', 'ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง');
    }
    const token = uid(24);
    SS.set('local_token', token);
    Engine.log(db, { user: username }, 'login', '', 'เข้าสู่ระบบ'); this.save(db);
    return { token, username, default_credentials: !!c.is_default };
  },
  async logout() { SS.del('local_token'); },
  async changeCredentials(oldPassword, newUsername, newPassword) {
    if (!this.isAdmin()) throw new AppError('FORBIDDEN', 'กรุณาเข้าสู่ระบบใหม่');
    const c = this.creds();
    if (hashPassword(oldPassword) !== c.hash) throw new AppError('AUTH', 'รหัสผ่านปัจจุบันไม่ถูกต้อง');
    LS.set('admin_cred', { username: newUsername, hash: hashPassword(newPassword), is_default: false });
    const db = this.load(); Engine.log(db, { user: newUsername }, 'change_password', '', `เปลี่ยนบัญชีผู้ดูแล (${c.username} → ${newUsername})`); this.save(db);
    return { username: newUsername };
  },
  async getMaster() { return clone(this.load().drug_master); },
  async saveMaster(list) {
    if (!this.isAdmin()) throw new AppError('FORBIDDEN', 'แก้ไขรายการยาได้เฉพาะผู้ดูแลระบบ');
    const db = this.load(); db.drug_master = clone(list);
    Engine.log(db, this.ctx(), 'save_master', '', `บันทึกรายการยาหลัก ${list.length} รายการ`); this.save(db);
    return { count: list.length };
  },
  async audit() { if (!this.isAdmin()) throw new AppError('FORBIDDEN', 'ต้องเข้าสู่ระบบ'); return clone(this.load().audit_log).reverse(); },
  async ping() { return { mode: 'demo', time: nowISO() }; },
  resetDemo() { LS.del('db'); this.seed(); },
};

const ApiStore = {
  kind: 'api',
  async call(action, payload = {}, method = 'POST') {
    if (!navigator.onLine) throw new AppError('OFFLINE', 'ไม่มีการเชื่อมต่ออินเทอร์เน็ต');
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), CONFIG.API_TIMEOUT_MS);
    try {
      let res;
      if (method === 'GET') {
        const qs = new URLSearchParams({ action, ...payload, _: Date.now() });
        res = await fetch(`${CONFIG.GAS_API_URL}?${qs}`, { signal: ctrl.signal, redirect: 'follow' });
      } else {
        // text/plain = simple request → ไม่มี CORS preflight (Apps Script ไม่รองรับ OPTIONS)
        res = await fetch(CONFIG.GAS_API_URL, { method: 'POST', signal: ctrl.signal, redirect: 'follow', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action, ...payload }) });
      }
      if (!res.ok) throw new AppError('HTTP', `เซิร์ฟเวอร์ตอบกลับสถานะ ${res.status}`);
      let json;
      try { json = await res.json(); } catch (e) { throw new AppError('BAD_RESPONSE', 'API ตอบกลับไม่ใช่ JSON (ตรวจสอบการ Deploy และสิทธิ์ "Anyone")'); }
      if (!json.success) throw new AppError(json.error?.code || 'API_ERROR', json.message || 'API แจ้งข้อผิดพลาด', json.error?.details, json.data);
      return json.data;
    } catch (e) {
      if (e.name === 'AbortError') throw new AppError('TIMEOUT', 'API ไม่ตอบสนองภายในเวลาที่กำหนด');
      if (e instanceof AppError) throw e;
      throw new AppError('NETWORK', 'เชื่อมต่อ API ไม่สำเร็จ: ' + e.message);
    } finally { clearTimeout(timer); }
  },
  async init() { Outbox.flush(); },
  async list() {
    const d = Auth.token ? await this.call('read', { token: Auth.token, include_items: true }) : await this.call('read', { include_items: 1 }, 'GET');
    return d.records || [];
  },
  async create(record, items, user) { return this.call('create', { record, items, user, token: Auth.token }); },
  async update(recordId, patch, user) { return this.call('update', { record_id: recordId, header: patch.header, items: patch.items, user, token: Auth.token }); },
  async remove(recordId) { return this.call('delete', { record_id: recordId, token: Auth.token }); },
  async login(username, password) { return this.call('login', { username, password }); },
  async logout() { try { await this.call('logout', { token: Auth.token }); } catch (e) { /* ignore */ } },
  async changeCredentials(oldPassword, newUsername, newPassword) { return this.call('change_password', { token: Auth.token, old_password: oldPassword, new_username: newUsername, new_password: newPassword }); },
  async getMaster() { const d = await this.call('master', {}, 'GET'); return d.drugs || []; },
  async saveMaster(list) { return this.call('save_master', { token: Auth.token, drugs: list }); },
  async audit() { const d = await this.call('audit', { token: Auth.token }); return d.logs || []; },
  async ping() { return this.call('health', {}, 'GET'); },
};

const Store = CONFIG.GAS_API_URL ? ApiStore : LocalStore;

/** คิวส่งข้อมูลซ้ำเมื่ออินเทอร์เน็ตขัดข้อง (เฉพาะโหมด API) — create ป้องกันซ้ำด้วย record_id, update เป็นการกำหนดค่า (ส่งซ้ำได้) */
const Outbox = {
  list() { return LS.get('outbox', []); },
  push(job) { const l = this.list(); l.push({ ...job, queued_at: nowISO(), id: uid(8) }); LS.set('outbox', l); UI.updateChrome(); },
  async flush() {
    if (Store.kind !== 'api' || !navigator.onLine) return;
    const l = this.list(); if (!l.length) return;
    const left = [];
    for (const job of l) {
      try {
        if (job.op === 'create') await ApiStore.create(job.record, job.items, job.user);
        else await ApiStore.update(job.record_id, job.patch, job.user);
      } catch (e) {
        if (['OFFLINE', 'NETWORK', 'TIMEOUT', 'HTTP'].includes(e.code)) left.push(job);
        else UI.toast(`รายการค้างส่ง (${job.record_id || ''}) ถูกปฏิเสธ: ${e.message}`, 'error', 8000);
      }
    }
    LS.set('outbox', left);
    if (left.length < l.length) { UI.toast(`ส่งข้อมูลที่ค้างสำเร็จ ${l.length - left.length} รายการ`, 'good'); Data.refresh().catch(() => {}); }
    UI.updateChrome();
  },
};
const isNetErr = e => ['OFFLINE', 'NETWORK', 'TIMEOUT'].includes(e?.code);

/** แคชข้อมูลที่ใช้ร่วมกันทุกหน้า */
const Data = {
  records: [], master: [], loadedAt: null, loading: null, error: null,
  async refresh() {
    if (this.loading) return this.loading;
    this.loading = (async () => {
      try {
        const [recs, master] = await Promise.all([Store.list(), Store.getMaster().catch(() => null)]);
        this.records = recs;
        this.master = (master && master.length ? master : DEFAULT_DRUGS).map(d => ({ ...d, item_no: Number(d.item_no), active: d.active !== false && String(d.active).toUpperCase() !== 'FALSE' }));
        this.loadedAt = new Date(); this.error = null;
      } catch (e) { this.error = e; throw e; } finally { this.loading = null; UI.updateChrome(); }
    })();
    return this.loading;
  },
  async ensure() { if (!this.loadedAt) { try { await this.refresh(); } catch (e) { UI.toast('โหลดข้อมูลไม่สำเร็จ: ' + e.message, 'error', 7000); } } },
  lastUpdated() { let m = ''; this.records.forEach(r => { if (r.updated_at && String(r.updated_at) > m) m = String(r.updated_at); }); return m; },
  findPeriod(dept, y, m) { return this.records.find(r => normName(r.department) === normName(dept) && Number(r.report_year) === Number(y) && Number(r.report_month) === Number(m)); },
  activeMaster() { return (this.master.length ? this.master : DEFAULT_DRUGS).filter(d => d.active !== false); },
};

/* =======================================================================
 * 6) UI KIT — toast / modal / confirm / busy
 * ======================================================================= */
const UI = {
  toast(msg, type = 'info', ms = 4500) {
    const ic = { good: 'check', error: 'alert', warn: 'alert', info: 'info' }[type] || 'info';
    const el = document.createElement('div');
    el.className = `toast ${type}`; el.setAttribute('role', type === 'error' ? 'alert' : 'status');
    el.innerHTML = `${icon(ic)}<div>${esc(msg)}</div><button class="t-close" aria-label="ปิด">${icon('x', 'ico-sm')}</button>`;
    el.querySelector('.t-close').onclick = () => el.remove();
    $('#toastRoot').appendChild(el);
    if (ms) setTimeout(() => el.remove(), ms);
  },
  modal({ title, body = '', size = '', actions = [], onClose, dismissible = true }) {
    const back = document.createElement('div');
    back.className = 'modal-back';
    back.innerHTML = `<div class="modal ${size}" role="dialog" aria-modal="true" aria-label="${esc(title)}">
      <div class="modal-head"><h3>${esc(title)}</h3><button class="btn btn-icon btn-ghost" data-x aria-label="ปิด">${icon('x')}</button></div>
      <div class="modal-body"></div>${actions.length ? '<div class="modal-foot"></div>' : ''}</div>`;
    const bodyEl = back.querySelector('.modal-body');
    if (typeof body === 'string') bodyEl.innerHTML = body; else bodyEl.appendChild(body);
    const prevFocus = document.activeElement;
    const close = (v) => { back.remove(); document.removeEventListener('keydown', onKey); onClose && onClose(v); prevFocus && prevFocus.focus && prevFocus.focus(); };
    const onKey = e => { if (e.key === 'Escape' && dismissible) close(); };
    document.addEventListener('keydown', onKey);
    back.querySelector('[data-x]').onclick = () => close();
    if (dismissible) back.addEventListener('mousedown', e => { if (e.target === back) close(); });
    const foot = back.querySelector('.modal-foot');
    actions.forEach(a => {
      const b = document.createElement('button');
      b.type = 'button'; b.className = `btn ${a.kind || 'btn-soft'}`; b.innerHTML = (a.icon ? icon(a.icon) : '') + esc(a.label);
      b.onclick = async () => { if (a.onClick) { const r = await a.onClick(b, close); if (r === false) return; } if (a.close !== false) close(a.value); };
      foot.appendChild(b);
    });
    $('#modalRoot').appendChild(back);
    setTimeout(() => { (back.querySelector('[autofocus]') || back.querySelector('.modal-foot .btn:last-child') || back.querySelector('[data-x]')).focus(); }, 30);
    return { el: back, body: bodyEl, close };
  },
  confirm({ title = 'ยืนยัน', message = '', html = '', confirmText = 'ยืนยัน', danger = false }) {
    return new Promise(resolve => {
      let done = false;
      this.modal({
        title, body: html || `<p>${esc(message)}</p>`,
        actions: [
          { label: 'ยกเลิก', kind: 'btn-ghost', onClick: () => { done = true; resolve(false); } },
          { label: confirmText, kind: danger ? 'btn-danger' : 'btn-primary', icon: danger ? 'trash' : 'check', onClick: () => { done = true; resolve(true); } },
        ],
        onClose: () => { if (!done) resolve(false); },
      });
    });
  },
  busy(on, text = 'กำลังดำเนินการ...') { $('#busy').hidden = !on; $('#busyText').textContent = text; },
  errorHTML(e) {
    const list = Array.isArray(e?.details) ? `<ul style="margin:8px 0 0;padding-left:20px">${e.details.slice(0, 12).map(d => `<li>${esc(d.message || d)}</li>`).join('')}${e.details.length > 12 ? `<li>…และอีก ${e.details.length - 12} รายการ</li>` : ''}</ul>` : '';
    return `<div class="banner crit">${icon('alert')}<div><b>${esc(e?.message || 'เกิดข้อผิดพลาด')}</b>${list}</div></div>`;
  },
  /** ปรับส่วนที่ใช้ร่วมกัน: สถานะการเชื่อมต่อ เวลาอัปเดต การ์ดสรุปด้านข้าง */
  updateChrome() {
    const chip = $('#connChip'), txt = $('#connText');
    const pending = Outbox.list().length;
    chip.classList.remove('online', 'error');
    if (Store.kind === 'demo') { txt.textContent = 'Demo Mode · Local Storage'; }
    else if (Data.error) { chip.classList.add('error'); txt.textContent = 'เชื่อมต่อ Google Sheets ไม่สำเร็จ'; }
    else { chip.classList.add('online'); txt.textContent = 'Google Sheets' + (pending ? ` · ค้างส่ง ${pending}` : ''); }
    const nb = $('#navOutbox'); nb.hidden = !pending; nb.textContent = pending;
    const lu = Data.lastUpdated();
    $('#lastUpdated').textContent = lu ? `ข้อมูลอัปเดตล่าสุด ${fmtDateTime(lu)}` : '';
    const latest = Data.records.length ? Data.records[Data.records.length - 1] : null;
    const usedItems = latest ? latest.items.filter(i => num(i.total_j) > 0 || num(i.total_b) > 0).length : 0;
    const days = latest ? new Set(latest.items.flatMap(i => DAY_KEYS.filter(k => num(i[k.b]) || num(i[k.j])).map(k => k.d))).size : 0;
    $('#sideCard').innerHTML = latest ? `
      <div class="sc-label">รวมรายจ่าย · ${esc(periodLabel(latest.report_month, latest.report_year))}</div>
      <div class="sc-value">${fmtMoney(latest.grand_total_amount)} <small style="font-size:13px;font-weight:500">บาท</small></div>
      <div class="sc-boxes"><div class="sc-box"><b>${Data.records.length}</b><small>ใบเบิก</small></div><div class="sc-box"><b>${usedItems}</b><small>รายการใช้</small></div><div class="sc-box"><b>${days}</b><small>วันบันทึก</small></div></div>`
      : `<div class="sc-label">ยังไม่มีข้อมูล</div><div class="sc-value">เริ่มบันทึกได้เลย</div>`;
  },
};
const safeAsync = fn => async (...a) => { try { return await fn(...a); } catch (e) { console.error(e); UI.toast(e.message || String(e), 'error', 7000); } };

/* =======================================================================
 * 7) FORM KIT — สร้างช่องกรอกจากนิยามฟิลด์ (นำไปใช้กับแบบฟอร์มประเภทอื่นได้)
 * ======================================================================= */
const FormKit = {
  html(fields, values, errors = {}) {
    return fields.map(f => this.field(f, values[f.key], errors[f.key], values)).join('');
  },
  field(f, v, err, values) {
    const id = 'f_' + f.key;
    const hidden = f.showIf && !f.showIf(values) ? 'hidden' : '';
    const req = f.required ? ' <span class="req" aria-hidden="true">*</span>' : '';
    const attrs = `id="${id}" data-key="${f.key}" ${f.required ? 'aria-required="true"' : ''}`;
    let ctl = '';
    switch (f.type) {
      case 'number':
        ctl = `<div class="num-input"><button type="button" data-num="-1" data-for="${f.key}" aria-label="ลด">−</button><input class="input" ${attrs} type="text" inputmode="numeric" value="${esc(v)}"><button type="button" data-num="1" data-for="${f.key}" aria-label="เพิ่ม">+</button></div>`; break;
      case 'textarea':
        ctl = `<textarea class="input" ${attrs} maxlength="${f.maxLength || 1000}" placeholder="${esc(f.placeholder || '')}">${esc(v)}</textarea>`; break;
      case 'select':
        ctl = `<select class="input" ${attrs}><option value="">— เลือก —</option>${(f.options || []).map(o => { const ov = o.value ?? o; return `<option value="${esc(ov)}" ${String(ov) === String(v) ? 'selected' : ''}>${esc(o.label ?? o)}</option>`; }).join('')}</select>`; break;
      case 'combo':
        ctl = `<input class="input" ${attrs} type="text" list="${id}_dl" value="${esc(v)}" maxlength="${f.maxLength || 200}"><datalist id="${id}_dl">${(f.options || []).map(o => `<option value="${esc(o)}">`).join('')}</datalist>`; break;
      case 'choice': case 'multi': {
        const sel = f.type === 'multi' ? String(v || '').split('|') : [String(v)];
        ctl = `<div class="choice-grid ${f.wide ? 'wide' : ''}" role="${f.type === 'multi' ? 'group' : 'radiogroup'}" aria-labelledby="${id}_l">${f.options.map(o => {
          const on = sel.includes(String(o.value));
          return `<button type="button" class="choice ${on ? 'on' : ''}" role="${f.type === 'multi' ? 'checkbox' : 'radio'}" aria-checked="${on}" data-key="${f.key}" data-choice="${esc(o.value)}"><span>${esc(o.label)}</span>${o.desc ? `<small>${esc(o.desc)}</small>` : ''}</button>`;
        }).join('')}</div>`; break;
      }
      case 'toggle':
        ctl = `<label class="switch"><input type="checkbox" ${attrs} ${v ? 'checked' : ''}><span class="track"></span><span>${esc(f.onLabel || 'ใช่')}</span></label>`; break;
      case 'rating':
        ctl = `<div class="rating" role="radiogroup">${Array.from({ length: f.max || 5 }, (_, i) => i + 1).map(n => `<button type="button" class="choice ${Number(v) === n ? 'on' : ''}" role="radio" aria-checked="${Number(v) === n}" data-key="${f.key}" data-choice="${n}"><span>${n}</span></button>`).join('')}</div>`; break;
      default: // text, date, time
        ctl = `<input class="input" ${attrs} type="${f.type || 'text'}" value="${esc(v)}" ${f.maxLength ? `maxlength="${f.maxLength}"` : ''} placeholder="${esc(f.placeholder || '')}">`;
    }
    return `<div class="field span-${f.cols || 6} ${err ? 'has-err' : ''}" data-field="${f.key}" ${hidden}>
      <label class="label" id="${id}_l" for="${id}">${esc(f.label)}${req}</label>${ctl}
      ${f.help ? `<div class="help">${esc(f.help)}</div>` : ''}<div class="err-msg" data-err="${f.key}">${err ? esc(err) : ''}</div></div>`;
  },
  /** ผูก event แบบ delegation; onChange(key) ถูกเรียกหลังค่าเปลี่ยน */
  bind(root, fields, values, onChange) {
    const def = k => fields.find(f => f.key === k);
    const set = (k, val) => { values[k] = val; this.refreshVisibility(root, fields, values); onChange(k); };
    root.addEventListener('input', e => {
      const k = e.target.dataset?.key; const f = k && def(k); if (!f || f.type === 'toggle') return;
      set(k, f.type === 'number' ? Engine.coerceNum(e.target.value) : e.target.value);
    });
    root.addEventListener('change', e => {
      const k = e.target.dataset?.key; const f = k && def(k); if (!f) return;
      if (f.type === 'toggle') set(k, e.target.checked);
      else if (f.type === 'select') set(k, e.target.value);
    });
    root.addEventListener('click', e => {
      const nb = e.target.closest('[data-num]');
      if (nb) {
        const f = def(nb.dataset.for); const inp = root.querySelector(`#f_${f.key}`);
        const v = clamp(num(inp.value) + Number(nb.dataset.num), f.min ?? -Infinity, f.max ?? Infinity);
        inp.value = v; set(f.key, v); return;
      }
      const c = e.target.closest('[data-choice]'); if (!c) return;
      const f = def(c.dataset.key); if (!f) return;
      let val = c.dataset.choice;
      if (f.type === 'multi') {
        const arr = String(values[f.key] || '').split('|').filter(Boolean);
        const i = arr.indexOf(val); i >= 0 ? arr.splice(i, 1) : arr.push(val); val = arr.join('|');
      } else if (f.type === 'choice' || f.type === 'rating') { val = isNaN(Number(val)) ? val : Number(val); }
      $$(`[data-key="${f.key}"][data-choice]`, root).forEach(b => {
        const on = f.type === 'multi' ? String(val).split('|').includes(b.dataset.choice) : b.dataset.choice === String(val);
        b.classList.toggle('on', on); b.setAttribute('aria-checked', on);
      });
      set(f.key, val);
    });
  },
  refreshVisibility(root, fields, values) { fields.forEach(f => { if (f.showIf) { const el = root.querySelector(`[data-field="${f.key}"]`); if (el) el.hidden = !f.showIf(values); } }); },
  validate(fields, values) {
    const errs = {};
    fields.forEach(f => {
      if (f.showIf && !f.showIf(values)) return;
      const v = values[f.key];
      if (f.required && (isBlank(v) || String(v).trim() === '')) { errs[f.key] = `กรุณากรอก${f.label}`; return; }
      if (f.type === 'number' && !isBlank(v)) {
        const n = Number(v);
        if (isNaN(n)) errs[f.key] = 'ต้องเป็นตัวเลข';
        else if (f.integer && !Number.isInteger(n)) errs[f.key] = 'ต้องเป็นจำนวนเต็ม';
        else if ((f.min != null && n < f.min) || (f.max != null && n > f.max)) errs[f.key] = `ต้องอยู่ระหว่าง ${f.min}–${f.max}`;
      }
    });
    return errs;
  },
  showErrors(root, errs) {
    $$('[data-err]', root).forEach(el => { const k = el.dataset.err; el.textContent = errs[k] || ''; el.closest('.field')?.classList.toggle('has-err', !!errs[k]); });
  },
};

/* =======================================================================
 * 8) VIZ — กราฟ SVG น้ำหนักเบา (ไม่ต้องพึ่ง CDN) พร้อม tooltip / keyboard / คลิกดูรายละเอียด
 *    เส้น 2px · แท่งปลายมน 4px · grid เส้นบาง · สี บ/จ ผ่านการตรวจ CVD แล้ว
 * ======================================================================= */
const Viz = {
  _id: 0,
  tip(html, x, y) {
    const t = $('#vizTip'); t.innerHTML = html; t.hidden = false;
    const r = t.getBoundingClientRect();
    let left = x + 14, top = y - r.height - 12;
    if (left + r.width > innerWidth - 8) left = x - r.width - 14;
    if (top < 8) top = y + 18;
    t.style.left = Math.max(8, left) + 'px'; t.style.top = top + 'px';
  },
  hideTip() { $('#vizTip').hidden = true; },
  ticks(max, count = 4) {
    if (!(max > 0)) return [0, 1];
    const raw = max / count, mag = Math.pow(10, Math.floor(Math.log10(raw))), n = raw / mag;
    const step = (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * mag;
    const out = []; for (let v = 0; v <= max + step * 0.999; v += step) out.push(+v.toFixed(6));
    return out;
  },
  /** เส้นโค้งแบบ monotone (ไม่เกินค่าจริง ไม่ติดลบ) */
  monotone(p) {
    const n = p.length; if (!n) return ''; if (n === 1) return `M${p[0][0]},${p[0][1]}`;
    const dx = [], m = [], t = [];
    for (let i = 0; i < n - 1; i++) { dx[i] = p[i + 1][0] - p[i][0]; m[i] = (p[i + 1][1] - p[i][1]) / (dx[i] || 1); }
    t[0] = m[0]; t[n - 1] = m[n - 2];
    for (let i = 1; i < n - 1; i++) t[i] = (m[i - 1] * m[i] <= 0) ? 0 : (3 * (dx[i - 1] + dx[i])) / ((2 * dx[i] + dx[i - 1]) / m[i - 1] + (dx[i] + 2 * dx[i - 1]) / m[i]);
    let d = `M${p[0][0]},${p[0][1]}`;
    for (let i = 0; i < n - 1; i++) {
      const h = dx[i] / 3;
      d += ` C${p[i][0] + h},${p[i][1] + h * t[i]} ${p[i + 1][0] - h},${p[i + 1][1] - h * t[i + 1]} ${p[i + 1][0]},${p[i + 1][1]}`;
    }
    return d;
  },
  mount(el, kind, cfg) {
    el.__viz = { kind, cfg };
    this.draw(el);
    if (!el.__ro && window.ResizeObserver) {
      let w = el.clientWidth;
      el.__ro = new ResizeObserver(() => { if (Math.abs(el.clientWidth - w) > 2) { w = el.clientWidth; this.draw(el); } });
      el.__ro.observe(el);
    }
  },
  draw(el) { if (el.__viz && el.isConnected) this[el.__viz.kind](el, el.__viz.cfg); },
  frame(el, cfg, max) {
    const W = Math.max(el.clientWidth || 300, 260), H = cfg.height || 240;
    const m = { l: 58, r: cfg.endLabels ? 56 : 14, t: 12, b: 30 };
    const ticks = this.ticks(max), top = ticks[ticks.length - 1] || 1;
    return { W, H, m, pw: W - m.l - m.r, ph: H - m.t - m.b, ticks, top, Y: v => m.t + (H - m.t - m.b) * (1 - v / top) };
  },
  axes(F, labels, X, fmtTick) {
    let s = F.ticks.map(t => `<line class="v-grid" x1="${F.m.l}" x2="${F.W - F.m.r}" y1="${F.Y(t)}" y2="${F.Y(t)}"/><text class="v-tick" x="${F.m.l - 8}" y="${F.Y(t) + 4}" text-anchor="end">${esc(fmtTick(t))}</text>`).join('');
    s += `<line class="v-axis" x1="${F.m.l}" x2="${F.W - F.m.r}" y1="${F.Y(0)}" y2="${F.Y(0)}"/>`;
    const every = Math.max(1, Math.ceil(labels.length / Math.max(1, Math.floor(F.pw / 52))));
    labels.forEach((lb, i) => { if (i % every === 0 || (i === labels.length - 1 && (labels.length - 1) % every > every * 0.6)) s += `<text class="v-tick" x="${X(i)}" y="${F.H - 9}" text-anchor="middle">${esc(lb)}</text>`; });
    return s;
  },
  line(el, cfg) {
    const { labels, series, fmt = fmtQty, fmtTick = fmtQty, onPick, tipLabels = labels, hint } = cfg;
    const n = labels.length;
    const max = Math.max(0, ...series.flatMap(s => s.values));
    const F = this.frame(el, cfg, max);
    const X = i => F.m.l + (n <= 1 ? F.pw / 2 : i * F.pw / (n - 1));
    const gid = 'g' + (++this._id);
    let s = `<svg width="${F.W}" height="${F.H}" viewBox="0 0 ${F.W} ${F.H}" role="img" tabindex="0" aria-label="${esc(cfg.aria || '')}"><defs>${series.map((se, i) => `<linearGradient id="${gid}_${i}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${se.color}" stop-opacity=".20"/><stop offset="1" stop-color="${se.color}" stop-opacity="0"/></linearGradient>`).join('')}</defs>`;
    s += this.axes(F, labels, X, fmtTick);
    const ends = [];
    series.forEach((se, si) => {
      const pts = se.values.map((v, i) => [X(i), F.Y(v)]);
      const path = this.monotone(pts);
      if (n > 1) s += `<path d="${path} L${X(n - 1)},${F.Y(0)} L${X(0)},${F.Y(0)} Z" fill="url(#${gid}_${si})"/>`;
      s += `<path d="${path}" fill="none" stroke="${se.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
      if (n === 1) s += `<circle cx="${pts[0][0]}" cy="${pts[0][1]}" r="4" fill="${se.color}"/>`;
      if (cfg.endLabels && n) ends.push({ y: pts[n - 1][1], name: se.name, x: pts[n - 1][0] });
    });
    ends.sort((a, b) => a.y - b.y);
    for (let i = 1; i < ends.length; i++) if (ends[i].y - ends[i - 1].y < 14) ends[i].y = ends[i - 1].y + 14;
    ends.forEach(e => { s += `<text class="v-dlabel" x="${e.x + 14}" y="${e.y + 4}">${esc(e.name)}</text>`; });
    s += `<g class="v-hover" visibility="hidden"><line class="v-cross" y1="${F.m.t}" y2="${F.Y(0)}"/>${series.map(se => `<circle r="4.5" fill="${se.color}" stroke="var(--surface-solid)" stroke-width="2"/>`).join('')}</g>`;
    s += `<rect x="${F.m.l - 6}" y="${F.m.t}" width="${F.pw + 12}" height="${F.ph}" fill="transparent" style="cursor:${onPick ? 'pointer' : 'crosshair'}"/></svg>`;
    el.innerHTML = s;
    const svg = el.querySelector('svg'), hov = svg.querySelector('.v-hover');
    let idx = -1;
    const show = (i, cx, cy) => {
      idx = clamp(i, 0, n - 1);
      hov.setAttribute('visibility', 'visible');
      const line = hov.querySelector('line'); line.setAttribute('x1', X(idx)); line.setAttribute('x2', X(idx));
      hov.querySelectorAll('circle').forEach((c, si) => { c.setAttribute('cx', X(idx)); c.setAttribute('cy', F.Y(series[si].values[idx])); });
      const html = `<div class="tt-title">${esc(tipLabels[idx])}</div>` + series.map(se => `<div class="tt-row"><span><i class="pill-${se.key || 'b'}" style="background:${se.color}"></i>${esc(se.name)}</span><b>${esc(fmt(se.values[idx]))}</b></div>`).join('') + (cfg.extra ? cfg.extra(idx) : '') + (onPick ? `<div class="tt-hint">${esc(hint || 'คลิกเพื่อดูรายละเอียด')}</div>` : '');
      if (cx == null) { const r = svg.getBoundingClientRect(); cx = r.left + X(idx) * r.width / F.W; cy = r.top + F.m.t + 10; }
      this.tip(html, cx, cy);
    };
    const hide = () => { hov.setAttribute('visibility', 'hidden'); this.hideTip(); };
    const idxAt = e => { const r = svg.getBoundingClientRect(); const x = (e.clientX - r.left) * F.W / r.width; return n <= 1 ? 0 : Math.round((x - F.m.l) / (F.pw / (n - 1))); };
    svg.addEventListener('pointermove', e => show(idxAt(e), e.clientX, e.clientY));
    svg.addEventListener('pointerleave', hide);
    svg.addEventListener('blur', hide);
    svg.addEventListener('click', e => { if (onPick) { const i = clamp(idxAt(e), 0, n - 1); hide(); onPick(i); } });
    svg.addEventListener('keydown', e => {
      if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') { e.preventDefault(); show((idx < 0 ? 0 : idx + (e.key === 'ArrowRight' ? 1 : -1))); }
      else if ((e.key === 'Enter' || e.key === ' ') && onPick && idx >= 0) { e.preventDefault(); hide(); onPick(idx); }
      else if (e.key === 'Escape') hide();
    });
  },
  bars(el, cfg) {
    const { labels, values, color, fmt = fmtQty, fmtTick = fmtQty, onPick, tipLabels = labels, hint, name = '' } = cfg;
    const n = labels.length;
    const F = this.frame(el, cfg, Math.max(0, ...values));
    const band = F.pw / Math.max(1, n);
    const bw = Math.max(2, Math.min(26, band - 2));          // ช่องว่างระหว่างแท่ง ≥ 2px
    const X = i => F.m.l + band * i + band / 2;
    let s = `<svg width="${F.W}" height="${F.H}" viewBox="0 0 ${F.W} ${F.H}" role="img" tabindex="0" aria-label="${esc(cfg.aria || '')}">`;
    s += this.axes(F, labels, X, fmtTick) + '<g class="v-bars">';
    values.forEach((v, i) => {
      if (!(v > 0)) return;
      const x = X(i) - bw / 2, y0 = F.Y(0), h = Math.max(1, y0 - F.Y(v)), r = Math.min(4, bw / 2, h);
      s += `<path class="v-bar" data-i="${i}" fill="${color}" d="M${x},${y0} V${y0 - h + r} Q${x},${y0 - h} ${x + r},${y0 - h} H${x + bw - r} Q${x + bw},${y0 - h} ${x + bw},${y0 - h + r} V${y0} Z"/>`;
    });
    s += '</g>';
    values.forEach((v, i) => { s += `<rect data-hit="${i}" x="${F.m.l + band * i}" y="${F.m.t}" width="${band}" height="${F.ph}" fill="transparent" style="cursor:${onPick ? 'pointer' : 'default'}"/>`; });
    s += '</svg>';
    el.innerHTML = s;
    const svg = el.querySelector('svg'), g = svg.querySelector('.v-bars');
    let idx = -1;
    const show = (i, cx, cy) => {
      idx = clamp(i, 0, n - 1);
      g.classList.add('hovering'); svg.querySelectorAll('.v-bar').forEach(b => b.classList.toggle('hot', Number(b.dataset.i) === idx));
      const html = `<div class="tt-title">${esc(tipLabels[idx])}</div><div class="tt-row"><span><i class="pill-j" style="background:${color}"></i>${esc(name)}</span><b>${esc(fmt(values[idx]))}</b></div>` + (cfg.extra ? cfg.extra(idx) : '') + (onPick && values[idx] > 0 ? `<div class="tt-hint">${esc(hint || 'คลิกเพื่อดูรายละเอียด')}</div>` : '');
      if (cx == null) { const r = svg.getBoundingClientRect(); cx = r.left + X(idx) * r.width / F.W; cy = r.top + F.m.t + 10; }
      this.tip(html, cx, cy);
    };
    const hide = () => { g.classList.remove('hovering'); this.hideTip(); };
    svg.addEventListener('pointermove', e => { const h = e.target.closest('[data-hit]'); if (h) show(Number(h.dataset.hit), e.clientX, e.clientY); });
    svg.addEventListener('pointerleave', hide);
    svg.addEventListener('blur', hide);
    svg.addEventListener('click', e => { const h = e.target.closest('[data-hit]'); if (h && onPick && values[h.dataset.hit] > 0) { hide(); onPick(Number(h.dataset.hit)); } });
    svg.addEventListener('keydown', e => {
      if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') { e.preventDefault(); show(idx < 0 ? 0 : idx + (e.key === 'ArrowRight' ? 1 : -1)); }
      else if ((e.key === 'Enter' || e.key === ' ') && onPick && idx >= 0 && values[idx] > 0) { e.preventDefault(); hide(); onPick(idx); }
      else if (e.key === 'Escape') hide();
    });
  },
  spark(el, { values, color, height = 46 }) {
    const W = Math.max(el.clientWidth || 200, 120), H = height, n = values.length;
    const max = Math.max(1, ...values);
    const X = i => (n <= 1 ? W / 2 : 2 + i * (W - 4) / (n - 1)), Y = v => 4 + (H - 8) * (1 - v / max);
    const pts = values.map((v, i) => [X(i), Y(v)]);
    const p = this.monotone(pts); const gid = 'sp' + (++this._id);
    el.innerHTML = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" aria-hidden="true"><defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".25"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>${n > 1 ? `<path d="${p} L${X(n - 1)},${H} L${X(0)},${H} Z" fill="url(#${gid})"/>` : ''}<path d="${p}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round"/></svg>`;
  },
  ring(el, { pct, color, size = 112, stroke = 11 }) {
    const r = (size - stroke) / 2, c = 2 * Math.PI * r, p = clamp(pct || 0, 0, 100);
    const shown = Math.floor(p * 10) / 10;   // ปัดลง: 99.96% แสดง 99.9% ไม่ใช่ 100%
    el.innerHTML = `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" role="img" aria-label="${fmtPct(p)}">
      <circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="var(--surface-sunk)" stroke-width="${stroke}"/>
      <circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${c * p / 100} ${c}" transform="rotate(-90 ${size / 2} ${size / 2})"/>
      <text x="50%" y="50%" text-anchor="middle" dominant-baseline="central" style="font: 700 20px var(--font); fill: var(--text)">${fmtPct(shown, shown % 1 ? 1 : 0)}</text></svg>`;
  },
};
const seriesColor = k => getComputedStyle(document.documentElement).getPropertyValue(k === 'b' ? '--series-b' : '--series-j').trim();

/* =======================================================================
 * 9) RECORD EDITOR HELPERS — ใช้ร่วมกันระหว่างหน้าบันทึกและหน้าผู้ดูแล
 * ======================================================================= */
const Editor = {
  /** สร้างใบเบิกใหม่ (ยังไม่บันทึก) พร้อมรายการยาที่ใช้งานอยู่ทั้งหมด */
  newRecord(h) {
    const id = genRecordId(h.report_year, h.report_month);
    const rec = {};
    REQ_COLUMNS.forEach(c => { rec[c] = ''; });
    Object.assign(rec, { record_id: id, hospital_name: h.hospital_name, form_title: h.form_title, department: h.department, report_month: h.report_month, report_year: h.report_year, grand_total_amount: 0 });
    rec.items = Data.activeMaster().map(d => Engine.blankItem(d, id));
    return rec;
  },
  /** เติมรายการยาใหม่จากรายการหลักที่ยังไม่มีในใบเบิกเดิม (ทำเครื่องหมาย _new) */
  withMasterItems(rec) {
    const have = new Set(rec.items.map(i => normName(i.drug_name)));
    let maxNo = Math.max(0, ...rec.items.map(i => Number(i.item_no)));
    Data.activeMaster().forEach(d => { if (!have.has(normName(d.drug_name))) rec.items.push({ ...Engine.blankItem({ ...d, item_no: ++maxNo }, rec.record_id), _new: true }); });
    return rec;
  },
  /** หาความแตกต่างระหว่างข้อมูลตั้งต้นกับข้อมูลที่แก้ไข → ส่งเฉพาะช่องที่เปลี่ยน (ป้องกันการเขียนทับงานของผู้อื่น) */
  diff(base, work, withStatus = false) {
    const header = {};
    HEADER_EDITABLE.concat(withStatus ? ['record_status'] : []).forEach(k => { if (String(base[k] ?? '') !== String(work[k] ?? '')) header[k] = work[k]; });
    const bm = new Map(base.items.map(i => [Number(i.item_no), i]));
    const items = []; let count = Object.keys(header).length;
    work.items.forEach(it => {
      const b = bm.get(Number(it.item_no));
      const ch = { item_no: Number(it.item_no) }; let n = 0;
      ITEM_EDITABLE.forEach(k => { if (String((b ? b[k] : '') ?? '') !== String(it[k] ?? '')) { ch[k] = it[k]; n++; } });
      if (n && (!b || it._new)) ['drug_name', 'unit', 'unit_price', 'stock'].forEach(k => { ch[k] = it[k]; });
      if (n) { items.push(ch); count += n; }
    });
    return { header, items, count };
  },
  payloadItems(rec) { return rec.items.map(it => { const o = { item_no: Number(it.item_no) }; ITEM_EDITABLE.forEach(k => { o[k] = it[k]; }); return o; }); },
  payloadHeader(rec) { const o = { record_id: rec.record_id }; HEADER_EDITABLE.forEach(k => { o[k] = rec[k]; }); if (rec.record_status) o.record_status = rec.record_status; return o; },
  daysWithData(rec) { return DAY_KEYS.filter(k => rec.items.some(i => num(i[k.b]) || num(i[k.j]))).map(k => k.d); },
  /** ตรวจสอบค่าช่องตัวเลขแต่ละช่องทันทีที่พิมพ์ */
  cellBad(f, v) {
    if (f === 'drug_name' || f === 'unit' || isBlank(v)) return false;
    const max = f === 'stock' ? CONFIG.MAX_STOCK : f === 'unit_price' ? CONFIG.MAX_PRICE : CONFIG.MAX_QTY;
    return typeof v === 'string' || v < 0 || v > max || decimals(v) > 2;
  },
  /** ตารางรายเดือนแบบเดียวกับแบบฟอร์มต้นฉบับ (แก้ไขได้ / อ่านอย่างเดียว) */
  gridHTML(rec, { editable = true, editName = false, locked = false } = {}) {
    const dim = daysInMonth(rec.report_year, rec.report_month);
    const days = DAY_KEYS.slice(0, dim);
    const dis = locked || !editable ? 'disabled' : '';
    const cell = (it, f, cls = '') => editable
      ? `<input class="${cls} ${isBlank(it[f]) ? '' : 'has'}" data-no="${it.item_no}" data-f="${f}" value="${esc(it[f])}" inputmode="${f === 'unit' || f === 'drug_name' ? 'text' : 'decimal'}" autocomplete="off" aria-label="${esc(it.drug_name)} ${esc(FIELD_LABELS[f] || f)}" ${dis}>`
      : `<span style="display:inline-block;min-width:${cls ? 60 : 30}px;padding:5px 4px">${isBlank(it[f]) ? '' : esc(f === 'unit_price' ? fmtMoney(it[f]) : it[f])}</span>`;
    const head1 = `<tr><th rowspan="2" class="stk c-no">ลำดับ</th><th rowspan="2" class="stk c-name">ประเภทเวชภัณฑ์ยา</th><th rowspan="2">Stock</th><th rowspan="2">ราคา/หน่วย</th><th rowspan="2">หน่วย</th>${days.map(k => `<th colspan="2" class="dsep">${k.d}</th>`).join('')}<th colspan="2" class="dsep">ยอดรวม</th><th rowspan="2" class="dsep">รวมเงิน<br>(บาท)</th></tr>`;
    const head2 = `<tr>${days.map(() => '<th class="sub-b dsep">บ</th><th class="sub-j">จ</th>').join('')}<th class="sub-b dsep">บ</th><th class="sub-j">จ</th></tr>`;
    const rows = rec.items.map(it => `<tr data-row="${it.item_no}">
      <td class="stk c-no">${it.item_no}</td>
      <td class="stk c-name">${editName && editable ? cell(it, 'drug_name', 'w-name') : esc(it.drug_name)}</td>
      <td>${cell(it, 'stock', 'w-lg')}</td><td>${cell(it, 'unit_price', 'w-lg')}</td><td>${cell(it, 'unit', 'w-lg')}</td>
      ${days.map(k => `<td class="dcell dsep">${cell(it, k.b)}</td><td class="dcell">${cell(it, k.j)}</td>`).join('')}
      <td class="tot dsep" data-tb="${it.item_no}">${fmtQty(it.total_b)}</td><td class="tot" data-tj="${it.item_no}">${fmtQty(it.total_j)}</td><td class="tot dsep" data-ta="${it.item_no}">${fmtMoney(it.total_amount)}</td></tr>`).join('');
    const foot = `<tr><td colspan="2" class="stk c-no" style="text-align:right">รวมรายจ่ายทั้งสิ้น (บาท)</td><td colspan="${3 + dim * 2}"></td><td class="tot" id="gTb">${fmtQty(sum(rec.items, i => i.total_b))}</td><td class="tot" id="gTj">${fmtQty(sum(rec.items, i => i.total_j))}</td><td class="tot" id="gTotal">${fmtMoney(rec.grand_total_amount)}</td></tr>`;
    return `<div class="mgrid-wrap"><table class="mgrid"><thead>${head1}${head2}</thead><tbody>${rows}</tbody><tfoot>${foot}</tfoot></table></div>`;
  },
  /** ผูก event ของตาราง/ช่องจำนวน: พิมพ์, ปุ่ม +/−, ลูกศรเลื่อนช่อง */
  bindCells(root, rec, onChange) {
    const item = no => rec.items.find(i => String(i.item_no) === String(no));
    const apply = inp => {
      const it = item(inp.dataset.no), f = inp.dataset.f; if (!it) return;
      const v = (f === 'drug_name' || f === 'unit') ? inp.value : Engine.coerceNum(inp.value);
      it[f] = v;
      const bad = this.cellBad(f, v);
      inp.classList.toggle('bad', bad); inp.classList.toggle('has', !isBlank(v) && !bad);
      inp.setAttribute('aria-invalid', bad);
      Engine.recalcItem(it); Engine.recalcRecord(rec, rec.items);
      const set = (sel, txt) => { const el = root.querySelector(sel); if (el) el.textContent = txt; };
      set(`[data-tb="${it.item_no}"]`, fmtQty(it.total_b)); set(`[data-tj="${it.item_no}"]`, fmtQty(it.total_j)); set(`[data-ta="${it.item_no}"]`, fmtMoney(it.total_amount));
      set('#gTb', fmtQty(sum(rec.items, i => i.total_b))); set('#gTj', fmtQty(sum(rec.items, i => i.total_j))); set('#gTotal', fmtMoney(rec.grand_total_amount));
      onChange && onChange(it, f, inp);
    };
    root.addEventListener('input', e => { if (e.target.matches('input[data-f]')) apply(e.target); });
    root.addEventListener('click', e => {
      const b = e.target.closest('[data-inc]'); if (!b) return;
      const inp = b.parentElement.querySelector('input[data-f]'); if (!inp || inp.disabled) return;
      inp.value = Math.max(0, num(inp.value) + Number(b.dataset.inc)); apply(inp);
    });
    root.addEventListener('focusin', e => { if (e.target.matches('.mgrid input')) e.target.select(); });
    root.addEventListener('keydown', e => {
      const inp = e.target; if (!inp.matches('input[data-f]')) return;
      const inGrid = !!inp.closest('.mgrid');
      const move = (dr, dc) => {
        if (inGrid) {
          const td = inp.closest('td'), tr = td.parentElement;
          if (dr) { const rows = $$('tbody tr', root); const r2 = rows[rows.indexOf(tr) + dr]; const t = r2 && r2.querySelector(`input[data-f="${inp.dataset.f}"]`); if (t) { t.focus(); return true; } }
          if (dc) { const ins = $$('input[data-f]', tr); const t = ins[ins.indexOf(inp) + dc]; if (t) { t.focus(); return true; } }
        } else if (dr) {
          const ins = $$(`input[data-f="${inp.dataset.f}"]`, root).filter(x => x.offsetParent); const t = ins[ins.indexOf(inp) + dr]; if (t) { t.focus(); return true; }
        }
        return false;
      };
      if (e.key === 'Enter' || e.key === 'ArrowDown') { if (move(1, 0)) e.preventDefault(); }
      else if (e.key === 'ArrowUp') { if (move(-1, 0)) e.preventDefault(); }
      else if (inGrid && e.key === 'ArrowRight' && inp.selectionStart === inp.value.length) { if (move(0, 1)) e.preventDefault(); }
      else if (inGrid && e.key === 'ArrowLeft' && inp.selectionEnd === 0) { if (move(0, -1)) e.preventDefault(); }
    });
    return { apply };
  },
};

/* =======================================================================
 * 10) ENTRY PAGE — หน้าแรก: บันทึกข้อมูล (3 ขั้นตอน, รายวัน/รายเดือน)
 * ======================================================================= */
const STEPS = [
  { t: 'ข้อมูลใบเบิก', d: 'เดือน · ปี · หน่วยงาน · ผู้บันทึก' },
  { t: 'บันทึกจำนวน', d: 'บ (เบิก) / จ (จ่าย)' },
  { t: 'ตรวจสอบและบันทึก', d: 'สรุปก่อนส่งข้อมูล' },
];
const EntryPage = {
  el: null, st: null, autosaveFound: null,
  title: 'บันทึกข้อมูลการเบิกจ่ายยา',
  sub: () => CONFIG.HEADER_TITLE + ' · ' + CONFIG.HEADER_SUBTITLE,
  fresh() {
    const t = todayBE();
    return {
      step: 0, day: t.d, q: '', unit: 'all', onlyFilled: false, saving: false, errs: {},
      v: { report_month: t.m, report_year: t.y, department: CONFIG.DEPARTMENT, recorder: LS.get('recorder', ''), hospital_name: CONFIG.ORG_NAME, form_title: CONFIG.FORM_TITLE, entry_mode: LS.get('entry_mode', 'daily') },
      work: null, base: null, orig: null, loadedKey: '',

  },
  async show() {

    if (!this.st) { this.st = this.fresh(); this.autosaveFound = LS.get('autosave'); }
    await Data.ensure();
    if (!this.st.work) this.loadPeriod();
    this.render();
  },
  periodKey(v = this.st.v) { return `${normName(v.department)}|${v.report_year}|${v.report_month}`; },
  /** โหลดใบเบิกของ (หน่วยงาน, เดือน, ปี) ที่เลือก — ถ้ามีอยู่แล้วจะแก้ไขต่อจากเดิม */
  loadPeriod() {
    const st = this.st, v = st.v;

    if (ex) {
      st.orig = clone(ex);
      st.work = Editor.withMasterItems(clone(ex));
      v.hospital_name = ex.hospital_name || v.hospital_name; v.form_title = ex.form_title || v.form_title;
    } else {
      st.orig = null;
      st.work = Editor.newRecord(v);
    }
    Engine.recalcRecord(st.work, st.work.items);
    st.base = clone(st.work);
    st.loadedKey = this.periodKey();
    st.day = clamp(st.day, 1, daysInMonth(v.report_year, v.report_month));
  },
  syncHeader() { const st = this.st; ['hospital_name', 'form_title', 'department', 'report_month', 'report_year'].forEach(k => { st.work[k] = k === 'report_month' || k === 'report_year' ? Number(st.v[k]) : sanitizeText(st.v[k], 160); }); },
  dirty() { const st = this.st; if (!st.work || !st.base) return false; this.syncHeader(); return Editor.diff(st.base, st.work).count > 0; },

          <div><h2>${esc(CONFIG.FORM_TITLE)} · ${esc(st.v.department || '')}</h2><p>กรอกข้อมูลตามขั้นตอน ระบบคำนวณยอดรวมและรวมเงินให้อัตโนมัติตามสูตรในแบบฟอร์มต้นฉบับ</p></div>
          <div class="progress-box"><div class="p-top"><span>ความคืบหน้าในการกรอกข้อมูล</span><b id="pgText">0%</b></div><div class="progress" role="progressbar" aria-label="ความคืบหน้า" id="pgRole"><span id="pgBar" style="width:0%"></span></div></div>
        </div>
        <div class="steps" role="tablist">${STEPS.map((s, i) => `<button type="button" class="step-btn ${i === st.step ? 'on' : ''} ${i < st.step ? 'done' : ''}" data-goto="${i}" role="tab" aria-selected="${i === st.step}"><span class="n">${i < st.step ? '✓' : i + 1}</span><span><b>${s.t}</b><small>${i === 1 ? (st.v.entry_mode === 'monthly' ? 'ตารางรายเดือน' : 'รายวัน') + ' · ' + s.d : s.d}</small></span></button>`).join('')}</div>
      </div>
      <div id="entryBanners" style="display:flex;flex-direction:column;gap:10px;margin-top:14px"></div>

    this.renderBanners(); this.renderStep(); this.renderSide(); this.renderActions(); this.updateProgress();

    }

  /* ---------- ขั้นตอนที่ 1: ข้อมูลใบเบิก ---------- */
  renderHeaderStep(box) {
    const st = this.st;
    box.className = 'card';
    box.innerHTML = `<div class="card-head"><h3>${icon('file')} ข้อมูลใบเบิก</h3><span class="sub">ช่องที่มี <span class="req">*</span> ต้องกรอก</span></div><div class="form-grid">${FormKit.html(HEADER_FIELDS, st.v, st.errs)}</div>`;
    if (this.locked()) $$('input,select,textarea', box).forEach(i => { if (['hospital_name', 'form_title'].includes(i.dataset.key)) i.disabled = true; });
    FormKit.bind(box, HEADER_FIELDS, st.v, key => {
      if (st.errs[key]) { delete st.errs[key]; FormKit.showErrors(box, st.errs); }
      if (key === 'entry_mode') { LS.set('entry_mode', st.v.entry_mode); this.renderStepsBar(); }
      if (key === 'recorder') LS.set('recorder', sanitizeText(st.v.recorder, 80));
      if (['report_month', 'report_year', 'department'].includes(key)) this.onPeriodChange(box);
      this.syncHeader(); this.updateProgress(); this.renderSide(); this.autosave();
    });
  },
  onPeriodChange: debounce(async function (box) {
    const st = this.st, v = st.v;
    const m = Number(v.report_month), y = Number(v.report_year);
    if (!(m >= 1 && m <= 12) || !(y >= 2500 && y <= 2700) || !String(v.department || '').trim()) return;
    if (this.periodKey() === st.loadedKey) return;
    if (st.orig || Editor.diff(st.base, st.work).count > 0) {
      const changed = Editor.diff(st.base, st.work).items.length > 0;
      if (changed && !(await UI.confirm({ title: 'เปลี่ยนเดือน/หน่วยงาน?', message: 'มีข้อมูลจำนวนที่ยังไม่ได้บันทึก หากเปลี่ยนเดือนหรือหน่วยงาน ข้อมูลที่ยังไม่บันทึกจะหายไป', confirmText: 'เปลี่ยนและทิ้งข้อมูล', danger: true }))) {
        Object.assign(v, { department: st.base.department, report_year: st.base.report_year, report_month: st.base.report_month });
        this.syncHeader();
        this.renderStep(); return;
      }
    }
    this.loadPeriod(); this.renderBanners(); this.renderSide(); this.updateProgress();
  }, 350),
  renderStepsBar() {
    const st = this.st;
    $$('.step-btn', this.el).forEach((b, i) => { const sm = b.querySelector('small'); if (i === 1) sm.textContent = (st.v.entry_mode === 'monthly' ? 'ตารางรายเดือน' : 'รายวัน') + ' · ' + STEPS[1].d; });
  },
  /* ---------- ขั้นตอนที่ 2a: บันทึกรายวัน ---------- */
  renderDaily(box) {
    const st = this.st, w = st.work, dim = daysInMonth(w.report_year, w.report_month), t = todayBE();
    const filled = new Set(Editor.daysWithData(w));
    const units = [...new Set(w.items.map(i => String(i.unit || '').trim()).filter(Boolean))];
    const isThisMonth = t.m === Number(w.report_month) && t.y === Number(w.report_year);
    box.className = 'card';
    box.innerHTML = `
      <div class="card-head"><h3>${icon('calendar')} เลือกวันที่ · ${esc(periodLabel(w.report_month, w.report_year))}</h3><span class="sub"><i class="pill-j" style="border-radius:50%;width:8px;height:8px"></i> = วันที่มีการบันทึกแล้ว</span></div>
      <div class="day-strip" id="dayStrip">${Array.from({ length: dim }, (_, i) => i + 1).map(d => `<button type="button" class="day-btn ${d === st.day ? 'on' : ''} ${filled.has(d) ? 'has' : ''} ${isThisMonth && d === t.d ? 'today' : ''}" data-day="${d}" aria-pressed="${d === st.day}" aria-label="วันที่ ${d}${filled.has(d) ? ' มีข้อมูลแล้ว' : ''}">${d}</button>`).join('')}</div>
      <div class="daily-tools">
        <div class="search">${icon('search')}<input class="input" id="drugSearch" placeholder="ค้นหารายการยา..." value="${esc(st.q)}" aria-label="ค้นหารายการยา"></div>
        <select class="input" id="unitFilter" style="max-width:150px" aria-label="กรองตามหน่วย"><option value="all">ทุกหน่วยนับ</option>${units.map(u => `<option ${u === st.unit ? 'selected' : ''}>${esc(u)}</option>`).join('')}</select>
        <label class="switch"><input type="checkbox" id="onlyFilled" ${st.onlyFilled ? 'checked' : ''}><span class="track"></span><span style="font-size:13px">เฉพาะที่กรอกแล้ว</span></label>
        <button type="button" class="btn btn-soft btn-sm" id="fillJ" ${this.locked() ? 'disabled' : ''} title="เติมช่อง จ ที่ยังว่างให้เท่ากับ บ">${icon('copy', 'ico-sm')} เติม จ = บ (ช่องว่าง)</button>
      </div>
      <div class="drug-list" id="drugList"></div>
      <div class="day-sum" id="daySum"></div>`;
    this.renderDrugRows(box);
    box.querySelector('#dayStrip').addEventListener('click', e => { const b = e.target.closest('[data-day]'); if (!b) return; st.day = Number(b.dataset.day); this.renderStep(); });
    box.querySelector('#drugSearch').addEventListener('input', e => { st.q = e.target.value; this.filterRows(box); });
    box.querySelector('#unitFilter').addEventListener('change', e => { st.unit = e.target.value; this.filterRows(box); });
    box.querySelector('#onlyFilled').addEventListener('change', e => { st.onlyFilled = e.target.checked; this.filterRows(box); });
    box.querySelector('#fillJ').addEventListener('click', () => {
      const k = DAY_KEYS[st.day - 1]; let n = 0;
      w.items.forEach(it => { if (!isBlank(it[k.b]) && isBlank(it[k.j])) { it[k.j] = it[k.b]; n++; } });
      Engine.recalcRecord(w, w.items); this.renderDrugRows(box); this.afterChange();
      UI.toast(n ? `เติมช่อง จ ให้เท่ากับ บ แล้ว ${n} รายการ` : 'ไม่มีช่อง จ ที่ว่างและมีค่า บ', n ? 'good' : 'info');
    });
    Editor.bindCells(box, w, (it) => { this.updateDrugRow(box, it); this.updateDaySum(box); this.afterChange(); });
    box.addEventListener('click', e => {
      const c = e.target.closest('[data-copy]'); if (!c || this.locked()) return;
      const it = w.items.find(i => String(i.item_no) === c.dataset.copy); const k = DAY_KEYS[st.day - 1];
      it[k.j] = it[k.b]; Engine.recalcItem(it); Engine.recalcRecord(w, w.items);
      const inp = box.querySelector(`input[data-no="${it.item_no}"][data-f="${k.j}"]`); inp.value = it[k.j]; inp.classList.toggle('has', !isBlank(it[k.j]));
      this.updateDrugRow(box, it); this.updateDaySum(box); this.afterChange();
    });
  },
  renderDrugRows(box) {
    const st = this.st, k = DAY_KEYS[st.day - 1], dis = this.locked() ? 'disabled' : '';
    const stepper = (it, f) => `<div class="stepper"><button type="button" data-inc="-1" tabindex="-1" aria-label="ลด" ${dis}>−</button><input data-no="${it.item_no}" data-f="${f}" class="${isBlank(it[f]) ? '' : 'has'}" value="${esc(it[f])}" inputmode="decimal" autocomplete="off" aria-label="${esc(it.drug_name)} ${esc(FIELD_LABELS[f])}" ${dis}><button type="button" data-inc="1" tabindex="-1" aria-label="เพิ่ม" ${dis}>+</button></div>`;
    box.querySelector('#drugList').innerHTML = st.work.items.map(it => `
      <div class="drug-row" data-row="${it.item_no}" data-name="${esc(normName(it.drug_name))}" data-unit="${esc(String(it.unit || '').trim())}">
        <div class="drug-no">${pad2(it.item_no)}</div>
        <div style="min-width:0"><div class="drug-name">${esc(it.drug_name)}</div><div class="drug-meta">${esc(it.unit || 'ไม่ระบุหน่วย')} · ${isBlank(it.unit_price) ? 'ไม่มีราคา' : fmtMoney(it.unit_price) + ' บาท/หน่วย'}</div></div>
        <div class="qty-pair">
          <div class="qty"><span class="qty-tag b">บ เบิก</span>${stepper(it, k.b)}</div>
          <div class="qty"><span class="qty-tag j">จ จ่าย</span>${stepper(it, k.j)}</div>
          <button type="button" class="mini-btn" data-copy="${it.item_no}" title="ให้ จ่าย = เบิก" ${dis}>จ=บ</button>
        </div>
        <div class="drug-sub" data-sub="${it.item_no}"></div>
      </div>`).join('');
    st.work.items.forEach(it => this.updateDrugRow(box, it));
    this.filterRows(box); this.updateDaySum(box);
  },
  updateDrugRow(box, it) {
    const k = DAY_KEYS[this.st.day - 1];
    const row = box.querySelector(`.drug-row[data-row="${it.item_no}"]`); if (!row) return;
    row.classList.toggle('filled', num(it[k.b]) > 0 || num(it[k.j]) > 0);
    row.classList.toggle('warn', num(it[k.j]) > num(it[k.b]));
    row.querySelector('[data-sub]').innerHTML = `ทั้งเดือน: <span class="pill-b"></span> บ ${fmtQty(it.total_b)} · <span class="pill-j"></span> จ ${fmtQty(it.total_j)} · รวมเงิน ${fmtMoney(it.total_amount)} บาท${num(it[k.j]) > num(it[k.b]) ? ' · <b style="color:var(--critical)">จ่ายมากกว่าเบิก</b>' : ''}`;
  },
  filterRows(box) {
    const st = this.st, q = normName(st.q), k = DAY_KEYS[st.day - 1];
    let shown = 0;
    $$('.drug-row', box).forEach(r => {
      const it = st.work.items.find(i => String(i.item_no) === r.dataset.row);
      const ok = (!q || r.dataset.name.includes(q)) && (st.unit === 'all' || r.dataset.unit === st.unit) && (!st.onlyFilled || !isBlank(it[k.b]) || !isBlank(it[k.j]));
      r.hidden = !ok; if (ok) shown++;
    });
    let em = box.querySelector('#drugEmpty');
    if (!shown) { if (!em) { em = document.createElement('div'); em.id = 'drugEmpty'; em.className = 'empty'; em.textContent = 'ไม่พบรายการตามเงื่อนไข'; box.querySelector('#drugList').appendChild(em); } }
    else if (em) em.remove();
  },
  updateDaySum(box) {
    const st = this.st, k = DAY_KEYS[st.day - 1], w = st.work;
    const b = sum(w.items, i => i[k.b]), j = sum(w.items, i => i[k.j]);
    const amt = sum(w.items, i => isBlank(i.unit_price) ? 0 : num(i.unit_price) * num(i[k.j]));
    const n = w.items.filter(i => num(i[k.b]) || num(i[k.j])).length;
    const el = box.querySelector('#daySum');
    if (el) el.innerHTML = `<span>สรุปวันที่ <b>${st.day}</b></span><span>รายการ <b>${n}</b></span><span><span class="pill-b"></span> บ <b>${fmtQty(b)}</b></span><span><span class="pill-j"></span> จ <b>${fmtQty(j)}</b></span><span>มูลค่าจ่าย <b>${fmtMoney(amt)}</b> บาท</span>`;
    const strip = box.querySelector(`.day-btn[data-day="${st.day}"]`); if (strip) strip.classList.toggle('has', n > 0);
  },
  /* ---------- ขั้นตอนที่ 2b: บันทึกรายเดือน (ตารางเหมือนต้นฉบับ) ---------- */
  renderMonthly(box) {
    const w = this.st.work;
    box.className = 'card';
    box.innerHTML = `<div class="card-head"><h3>${icon('table')} ตารางบันทึกรายเดือน · ${esc(periodLabel(w.report_month, w.report_year))}</h3><span class="sub">Enter/↓ ไปแถวถัดไป · ←/→ เลื่อนช่อง · ยอดรวมและรวมเงินคำนวณอัตโนมัติ</span></div>
      <div class="legend" style="margin-bottom:10px"><span><i class="pill-b"></i>บ = เบิก</span><span><i class="pill-j"></i>จ = จ่าย</span><span>รวมเงิน = ราคา/หน่วย × ยอดรวม จ</span></div>
      ${Editor.gridHTML(w, { editable: true, locked: this.locked() })}`;
    Editor.bindCells(box, w, () => this.afterChange());
  },
  /* ---------- ขั้นตอนที่ 3: ตรวจสอบ ---------- */
  renderReview(box) {
    const st = this.st, w = st.work;
    this.syncHeader();
    const herrs = FormKit.validate(HEADER_FIELDS, st.v);
    const errs = Object.values(herrs).map(m => ({ message: m, step: 0 })).concat(Engine.validate(w, w.items).map(e => ({ ...e, step: 1 })));
    const warns = Engine.warnings(w, w.items);
    const used = w.items.filter(i => num(i.total_b) || num(i.total_j));
    const days = Editor.daysWithData(w);
    const d = Editor.diff(st.base, w);
    const willDo = st.orig ? (d.count ? `บันทึกการเปลี่ยนแปลง <b>${d.count}</b> ช่อง ในใบเบิก <b>${esc(w.record_id)}</b>` : 'ยังไม่มีการเปลี่ยนแปลงจากข้อมูลเดิม') : `สร้างใบเบิกใหม่ <b>${esc(w.record_id)}</b> (${w.items.length} รายการยา)`;
    box.className = '';
    box.innerHTML = `
      <div class="card">

        <div class="kv" style="margin-bottom:14px">
          <div><small>โรงพยาบาล</small><b>${esc(w.hospital_name)}</b></div><div><small>แบบฟอร์ม</small><b>${esc(w.form_title)}</b></div>
          <div><small>หน่วยงาน</small><b>${esc(w.department)}</b></div><div><small>เดือน</small><b>${esc(periodLabel(w.report_month, w.report_year))}</b></div>
          <div><small>ผู้บันทึก</small><b>${esc(st.v.recorder || '–')}</b></div><div><small>การดำเนินการ</small><b>${willDo}</b></div>
        </div>
        <div class="stat-list" style="grid-template-columns:repeat(auto-fill,minmax(150px,1fr))">
          <div class="stat"><small>ยอดรวม บ (เบิก)</small><b>${fmtQty(sum(w.items, i => i.total_b))}</b></div>
          <div class="stat"><small>ยอดรวม จ (จ่าย)</small><b>${fmtQty(sum(w.items, i => i.total_j))}</b></div>
          <div class="stat"><small>รวมรายจ่ายทั้งสิ้น</small><b>${fmtMoney(w.grand_total_amount)}</b> บาท</div>
          <div class="stat"><small>วันที่มีข้อมูล</small><b>${days.length}</b> วัน</div>

        </div>
      </div>
      <div class="card" style="margin-top:16px">
        <div class="card-head"><h3>ผลการตรวจสอบ</h3><span class="sub">${errs.length} ข้อผิดพลาด · ${warns.length} คำเตือน</span></div>
        <ul class="review-list">
          ${errs.map(e => `<li class="crit">${icon('alert')}<div>${esc(e.message)} <button class="link-btn" data-goto="${e.step}">ไปแก้ไข</button></div></li>`).join('')}
          ${warns.slice(0, 30).map(x => `<li class="warn">${icon('alert')}<div>${esc(x.message)}${x.day ? ` <button class="link-btn" data-day="${x.day}">ไปวันที่ ${x.day}</button>` : ''}</div></li>`).join('')}
          ${warns.length > 30 ? `<li class="warn">${icon('alert')}<div>…และคำเตือนอีก ${warns.length - 30} รายการ</div></li>` : ''}
          ${!errs.length && !warns.length ? `<li class="good">${icon('check')}<div>ข้อมูลครบถ้วนและถูกต้อง พร้อมบันทึก</div></li>` : ''}
          ${!used.length ? `<li class="warn">${icon('info')}<div>ยังไม่มีการกรอกจำนวน บ/จ ในใบเบิกนี้</div></li>` : ''}
        </ul>
      </div>
      <div class="card" style="margin-top:16px">
        <div class="card-head"><h3>รายการที่มีการเบิก/จ่าย</h3><span class="sub">${used.length} รายการ</span></div>
        ${used.length ? `<div class="table-wrap" style="max-height:420px"><table class="tbl"><thead><tr><th>ลำดับ</th><th>ประเภทเวชภัณฑ์ยา</th><th>หน่วย</th><th class="r">ราคา/หน่วย</th><th class="r">ยอดรวม บ</th><th class="r">ยอดรวม จ</th><th class="r">รวมเงิน (บาท)</th></tr></thead>
        <tbody>${used.map(i => `<tr><td>${i.item_no}</td><td class="name-cell">${esc(i.drug_name)}</td><td>${esc(i.unit)}</td><td class="r">${isBlank(i.unit_price) ? '<span class="muted">–</span>' : fmtMoney(i.unit_price)}</td><td class="r">${fmtQty(i.total_b)}</td><td class="r">${fmtQty(i.total_j)}</td><td class="r">${fmtMoney(i.total_amount)}</td></tr>`).join('')}</tbody>

      </div>`;
    box.addEventListener('click', e => {

  /* ---------- แผงสรุปด้านข้าง ---------- */
  renderSide() {

        <div style="font-size:13px;color:var(--muted);margin:-6px 0 10px">${esc(periodLabel(w.report_month, w.report_year))} · <span class="code">${esc(w.record_id)}</span></div>

      </div>`;
    side.onclick = async e => {

      if (o) {
        const dr = LS.get('drafts', []).find(x => x.id === o.dataset.open); if (!dr) return;

  },
  updateSideStats() {
    const w = this.st.work, set = (id, v) => { const el = $('#' + id); if (el) el.textContent = v; };
    set('sdB', fmtQty(sum(w.items, i => i.total_b))); set('sdJ', fmtQty(sum(w.items, i => i.total_j))); set('sdT', fmtMoney(w.grand_total_amount));
    set('sdD', Editor.daysWithData(w).length); set('sdU', w.items.filter(i => num(i.total_b) || num(i.total_j)).length);
    const dd = $('#sdDirty'); if (dd) { const dirty = this.dirty(); dd.style.color = dirty ? 'var(--serious)' : 'var(--muted)'; dd.textContent = dirty ? '● มีการแก้ไขที่ยังไม่บันทึก' : '✓ ไม่มีการแก้ไขค้าง'; }
  },
  afterChange() { this.updateSideStats(); this.updateProgress(); this.autosave(); },
  renderActions() {
    const st = this.st, bar = $('#actionBar'), locked = this.locked();
    bar.innerHTML = `
      <button type="button" class="btn btn-ghost" data-a="back" title="ย้อนกลับ" aria-label="ย้อนกลับ" ${st.step === 0 ? 'disabled' : ''}>${icon('left')}<span class="lbl">ย้อนกลับ</span></button>
      <button type="button" class="btn btn-ghost" data-a="clear" title="ล้างข้อมูล" aria-label="ล้างข้อมูล" ${locked ? 'disabled' : ''}>${icon('undo')}<span class="lbl">ล้างข้อมูล</span></button>
      <button type="button" class="btn btn-ghost" data-a="new" title="เริ่มรายการใหม่" aria-label="เริ่มรายการใหม่">${icon('new')}<span class="lbl">เริ่มรายการใหม่</span></button>
